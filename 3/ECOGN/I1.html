.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab{background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:8px 12px;font-weight:600}.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}.tabs.small .tab{font-size:.85rem;padding:6px 10px}
.fields{display:grid;gap:10px;margin:12px 0}.fld{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.fld>span:first-child{min-width:210px;font-weight:600}.fld input{width:150px}.fld em{color:var(--muted)}

<script>// Contenu partagé Word + HTML (aligné sur le cours « Économie générale – Chapitre 1 »)
const CATS = [
  { id: 1, name: "Fonctionnement du marché du travail" },
  { id: 2, name: "Le chômage" },
  { id: 3, name: "Contrats de travail" },
  { id: 4, name: "Aspects quantitatifs" },
  { id: 5, name: "Frontaliers et migrations" },
  { id: 6, name: "Aspects qualitatifs" },
];

// c = catégorie, q = recto, a = verso, src = source dans le cours, star = définition bleue/surlignée du cours
const CARDS = [
  // 1
  { c: 1, star: 1, q: "Qu'est-ce qu'un marché ?", a: "Un lieu réel ou fictif d'échange des biens et services où se rencontrent l'offre et la demande.", src: "p. 25 (encadré)" },
  { c: 1, star: 1, q: "Qu'est-ce que le marché du travail ?", a: "Le lieu de rencontre entre l'offre et la demande de travail. Dans le cadre d'une relation de travail, la rémunération constitue la contrepartie directe du travail effectué par le salarié au profit de son employeur.", src: "p. 25" },
  { c: 1, star: 1, q: "Qu'est-ce que l'offre de travail ? Qui l'exprime ?", a: "Elle est constituée par les ménages qui offrent leur force de travail aux entreprises (capacités physiques et/ou intellectuelles d'un individu). Elle provient de ceux qui sont à la recherche d'un emploi : les demandeurs d'emploi.", src: "p. 25" },
  { c: 1, star: 1, q: "Qu'est-ce que la demande de travail ? Qui l'exprime ?", a: "Elle est constituée par les entreprises qui demandent du travail. Elle provient de ceux qui offrent les emplois : les offreurs d'emplois.", src: "p. 25" },
  { c: 1, q: "Piège : qui est « offreur » et qui est « demandeur » sur le marché du travail ?", a: "Les ménages OFFRENT du travail mais DEMANDENT un emploi (= demandeurs d'emploi). Les entreprises DEMANDENT du travail mais OFFRENT des emplois (= offreurs d'emplois).", src: "p. 25" },
  { c: 1, star: 1, q: "Qu'est-ce que la population active ?", a: "L'ensemble des personnes résidentes en âge de travailler (15 – 64 ans) qui occupent un emploi ou qui sont activement à la recherche d'un emploi. Les chômeurs font donc également partie de la population active.", src: "p. 25" },
  { c: 1, star: 1, q: "Qu'est-ce que la population inactive ? Exemples ?", a: "Les personnes qui ne sont pas à la recherche d'un travail rémunéré : élèves, étudiants, retraités, femmes/hommes au foyer, etc.", src: "p. 26 (schéma)" },
  { c: 1, q: "Comment se compose la population totale ?", a: "Population totale = population active (population active occupée + chômeurs) + population inactive.", src: "p. 26 (schéma)" },
  { c: 1, q: "Qu'est-ce que la population active occupée ?", a: "Les personnes avec un travail rémunéré (partie de la population active qui a un emploi).", src: "p. 26 (schéma)" },
  { c: 1, q: "Qui fait partie des chômeurs dans le schéma de la population ?", a: "Les personnes à la recherche d'un travail rémunéré. Ils font partie de la population active (mais pas de la population active occupée).", src: "p. 26 (schéma)" },
  // 2
  { c: 2, star: 1, q: "Que représente le nombre de chômeurs selon le STATEC ?", a: "Le nombre de demandeurs d'emploi enregistrés à l'Agence pour le développement de l'emploi (ADEM).", src: "p. 26" },
  { c: 2, star: 1, q: "Quels sont les critères pour être considéré comme chômeur (demandeur d'emploi) au Luxembourg ?", a: "Toute personne : âgée entre 16 et 64 ans ; résidant sur le territoire national ; sans emploi ; à la recherche d'un emploi approprié ; indemnisée ou non indemnisée ; disponible sur le marché du travail ; et ayant respecté les obligations de suivi de l'ADEM.", src: "p. 26" },
  { c: 2, q: "Qu'est-ce que le STATEC ?", a: "L'Administration de l'État luxembourgeois qui a comme mission principale de récolter et de produire des statistiques, des analyses et des études sur la société luxembourgeoise.", src: "p. 26 (encadré)" },
  { c: 2, q: "Qu'est-ce que l'ADEM ?", a: "L'Agence pour le développement de l'emploi : l'administration en charge des demandeurs d'emploi (chômeurs) et de l'orientation professionnelle.", src: "p. 26 (encadré)" },
  { c: 2, star: 1, q: "Comment calcule-t-on le taux de chômage ?", a: "Taux de chômage = (Nombre de chômeurs ÷ Population active) × 100. Il désigne la part des chômeurs dans la population active (actifs occupés + chômeurs).", src: "p. 27" },
  { c: 2, q: "Calculez le taux de chômage d'août 2021 (16.538 chômeurs ; population active 298.877).", a: "16.538 ÷ 298.877 = 0,0553 → × 100 = 5,53 %. Environ 5,5 personnes actives sur 100 sont au chômage.", src: "p. 27" },
  { c: 2, star: 1, q: "Qu'est-ce qu'un jeune demandeur d'emploi (chômage des jeunes) ?", a: "Toute personne de moins de 25 ans, sans emploi, résidant sur le territoire national, disponible pour le marché du travail, à la recherche d'un emploi approprié, non affectée à une mesure pour l'emploi, indemnisée ou non, et ayant respecté les obligations de suivi de l'ADEM.", src: "p. 28" },
  { c: 2, star: 1, q: "Qu'est-ce qu'un chômeur de longue durée ?", a: "Une personne activement à la recherche d'un emploi pendant plus d'un an. Au Luxembourg : 4.919 chômeurs de longue durée en janvier 2019, soit 32 % du nombre total des chômeurs.", src: "p. 28" },
  { c: 2, q: "Quelle est la tranche d'âge de la population active et celle d'un chômeur ?", a: "Population active : 15 – 64 ans. Chômeur (demandeur d'emploi) au Luxembourg : 16 – 64 ans (selon le cours).", src: "p. 25-26" },
  { c: 2, q: "Chômage des jeunes par niveau de formation (août 2017) : quels niveaux sont les plus touchés ?", a: "Niveau moyen supérieur (2e et 1e ES) : 620 jeunes, 41 % ; niveau inférieur (9 années d'études) : 604, 40 % ; moyen inférieur : 200, 13 % ; supérieur : 90, 6 % ; non précisé : 14, 1 %. Total : 1.528 jeunes chômeurs.", src: "p. 28 (graphique)" },
  { c: 2, q: "Indemnité de chômage : conditions, durée, montant (notes sur adem.lu) ?", a: "Conditions : perte d'emploi involontaire, domicile au Luxembourg, inscription comme demandeur, disponibilité, au moins 6 mois travaillés dans les 12 derniers mois, âge 16-64. Durée : selon le travail effectué (max. 12 mois, prolongation possible). Montant : 80 % du salaire brut moyen des 3 derniers mois (85 % avec enfant à charge), plafonné à 2,5 × salaire social minimum, dégressif avec la durée. (À vérifier sur adem.lu.)", src: "Application 2 (notes manuscrites)" },
  { c: 2, q: "De quelles mesures les jeunes chômeurs peuvent-ils bénéficier à l'ADEM ?", a: "Des formations au-delà de la formation initiale et des contrats spéciaux adaptés aux besoins des jeunes (exemples cités dans les notes manuscrites, lecture incertaine : « IE/CIE », « Jobelo »).", src: "Application 2 Q2" },
  // 3
  { c: 3, star: 1, q: "Qu'est-ce qu'un contrat de travail ?", a: "La convention qui encadre la relation de travail et par laquelle une personne s'engage à travailler pour le compte et sous la direction d'un employeur, contre rémunération.", src: "p. 29" },
  { c: 3, q: "Qu'est-ce qu'une convention ?", a: "Un accord de volonté conclu entre deux ou plusieurs parties.", src: "p. 29 (encadré)" },
  { c: 3, star: 1, q: "Qu'est-ce qu'un CDI ? Comment prend-il fin ?", a: "Contrat à durée indéterminée : forme de contrat de travail généralement utilisée, sans fixation d'une date d'échéance. Il prend fin si une des parties en prend volontairement l'initiative ; l'employeur ne peut le résilier que sous certaines conditions (ex. : faute grave, raisons économiques).", src: "p. 29" },
  { c: 3, star: 1, q: "Qu'est-ce qu'un CDD ?", a: "Contrat à durée déterminée : peut être conclu pour l'exécution d'une tâche précise et une durée limitée. Il prend fin automatiquement à l'échéance prévue par les parties.", src: "p. 29" },
  { c: 3, q: "Dans quels cas peut-on conclure un CDD ?", a: "Pour faire face à l'absence temporaire d'un salarié ; pour exécuter des travaux saisonniers ; pour exécuter des tâches occasionnelles et ponctuelles ; etc.", src: "p. 29" },
  { c: 3, star: 1, q: "Quelle est la durée maximale d'un CDD ? Combien de renouvellements ?", a: "24 mois au maximum, renouvellements compris. Il peut être renouvelé au maximum deux fois.", src: "p. 29" },
  { c: 3, star: 1, q: "Quand un CDD peut-il être requalifié en CDI ?", a: "Par la juridiction du travail, par exemple lorsque la durée maximale du contrat n'est pas respectée (ex. : 3e renouvellement).", src: "p. 29 ; Application 4 Q2" },
  { c: 3, star: 1, q: "Qu'est-ce qu'un contrat de travail intérimaire ?", a: "Le salarié est recruté par une agence spécialisée dans l'intérim et envoyé par cette agence dans une entreprise pour l'exécution d'une tâche précise et non durable.", src: "p. 29" },
  { c: 3, q: "Qu'est-ce que le contrat d'engagement pendant les vacances scolaires ?", a: "Un contrat spécifique (pas un contrat de travail) pour élèves et étudiants. Maximum 2 mois par an (un ou plusieurs contrats). Les élèves/étudiants sont exonérés d'impôts et de cotisations sociales : le salaire brut correspond au salaire net.", src: "p. 30 (encadré)" },
  { c: 3, q: "Répartition des contrats de travail au Luxembourg (mars 2021) ?", a: "CDI 86,8 % ; CDD 5,0 % ; intérimaires 1,7 % ; apprentis 0,8 % ; sans objet – indépendants 5,8 %.", src: "p. 30 (graphique)" },
  { c: 3, q: "Affaire Heinz Müller : quel est le problème et l'issue ?", a: "Gardien de but du FSV Mayence 05, il saisit le tribunal du travail pour faire requalifier son CDD en CDI après le non-renouvellement de son contrat (après 5 ans). Il obtient gain de cause en 1re instance (plus de deux ans dans la même entreprise), mais en 2e instance la requalification est rejetée : le football n'est pas comparable aux autres métiers (performances non garanties au fil des années), ce qui justifie des contrats temporaires.", src: "Découvrir – Document 3" },
  // 4
  { c: 4, star: 1, q: "Qu'est-ce que l'emploi intérieur ?", a: "Toutes les personnes travaillant sur le territoire national, quel que soit leur lieu de résidence ou leur nationalité. Il inclut les frontaliers étrangers travaillant au Luxembourg, mais exclut les frontaliers luxembourgeois travaillant à l'étranger ou pour les institutions internationales.", src: "p. 31" },
  { c: 4, star: 1, q: "Qu'est-ce que l'emploi national ?", a: "L'emploi des personnes résidant sur le territoire luxembourgeois. Il inclut les frontaliers luxembourgeois travaillant à l'étranger et les personnes travaillant pour les institutions internationales (institutions européennes, ambassades…), mais exclut les frontaliers non-résidents.", src: "p. 33" },
  { c: 4, q: "Quelle est la différence essentielle entre emploi intérieur et emploi national ?", a: "Emploi intérieur = critère du LIEU DE TRAVAIL (travailler au Luxembourg, résident ou non). Emploi national = critère du LIEU DE RÉSIDENCE (résider au Luxembourg, travailler ici ou à l'étranger).", src: "p. 31-33" },
  { c: 4, q: "Formule : comment calculer l'emploi national ?", a: "Emploi national = Emploi intérieur − Frontaliers non-résidents + Frontaliers résidents. (2020 : 474.300 − 210.400 + 13.200 = 277.100.)", src: "Application 5" },
  { c: 4, q: "Formule : comment retrouver le nombre de frontaliers non-résidents ?", a: "Frontaliers non-résidents = Emploi intérieur + personnes résidant au Luxembourg et travaillant à l'étranger ou pour des institutions internationales − Emploi national. (2020 : 474.300 + 13.200 − 277.100 = 210.400.)", src: "Application 6 (encadré)" },
  { c: 4, star: 1, q: "Comment calcule-t-on un taux de croissance ?", a: "Taux de croissance = [(Valeur N − Valeur N-1) ÷ Valeur N-1] × 100. Il mesure l'évolution d'une grandeur d'une période à l'autre ; il est exprimé en pourcentage.", src: "p. 32" },
  { c: 4, q: "Exemple du cours : taux de croissance de l'emploi intérieur 2019 → 2020 ?", a: "(474.300 − 465.000) ÷ 465.000 = 0,02 → 2 %.", src: "p. 32" },
  { c: 4, q: "Évolution de l'emploi intérieur 2000-2020 ?", a: "De 264.000 (2000) à 474.000 (2020) : presque +80 %, soit 210.000 emplois créés en 20 ans.", src: "p. 31" },
  { c: 4, q: "Évolution de l'emploi national 2000-2020 ?", a: "De 185.000 (2000) à 277.000 (2020) : presque +50 % (+92.000 emplois). Calcul de l'Application 5 : 184.700 → 277.100 = +50,03 %.", src: "p. 33 ; Application 5" },
  { c: 4, q: "Quelles branches expliquent la hausse de l'emploi ?", a: "Les services d'information et de communication, les activités spécialisées (ex. : activités comptables) et les services de soutien (ex. : nettoyage) : les branches les plus dynamiques du marché du travail luxembourgeois.", src: "p. 33" },
  { c: 4, q: "Pourquoi l'écart entre emploi intérieur et national grandit-il ?", a: "L'emploi intérieur a augmenté plus vite que l'emploi national : la croissance de la population résidente (Luxembourgeois et étrangers) ne suffisait pas à couvrir les besoins en main-d'œuvre ; le pays recourt aux frontaliers.", src: "Application 6" },
  // 5
  { c: 5, star: 1, q: "Qu'est-ce qu'un frontalier ?", a: "Toute personne qui exerce son activité professionnelle sur le territoire d'un État et réside sur le territoire d'un autre État.", src: "p. 34" },
  { c: 5, q: "Pourquoi la situation du marché du travail luxembourgeois est-elle très particulière ?", a: "L'économie est étroitement liée à la population frontalière : forte dépendance envers cette main-d'œuvre. En 2020, 210.000 frontaliers viennent travailler chaque jour, soit 44 % de l'emploi intérieur. Le marché est caractérisé par une pénurie de main-d'œuvre.", src: "p. 34" },
  { c: 5, q: "D'où viennent les frontaliers ?", a: "De la France, de la Belgique et de l'Allemagne (Grande Région). En 2020 (salariés) : France ≈ 105.700 ; Allemagne ≈ 50.300 ; Belgique ≈ 48.800.", src: "p. 34 ; Application 5" },
  { c: 5, star: 1, q: "Comment le nombre de frontaliers a-t-il évolué ?", a: "Il n'a cessé de croître depuis 2000 : 89.000 frontaliers en 2000 → 210.000 en 2020, soit +136 % en 20 ans.", src: "p. 34" },
  { c: 5, star: 1, q: "Quelles sont les raisons du développement de l'emploi frontalier ?", a: "Un taux de chômage élevé dans la Grande Région ; des différences de rémunération entre les pays ; la proximité des frontières ; la situation linguistique du pays.", src: "p. 34" },
  { c: 5, q: "Salaire minimum brut mensuel (avril 2022) : comparaison ?", a: "Luxembourg 2.313,38 € ; Belgique 1.658,23 € ; Allemagne 1.621,00 € ; France 1.603,12 €. Le salaire minimum luxembourgeois est nettement plus élevé : un facteur d'attraction pour les frontaliers.", src: "p. 35" },
  { c: 5, star: 1, q: "Qu'est-ce que l'immigration ?", a: "L'installation durable d'individus dans un pays d'accueil.", src: "p. 36" },
  { c: 5, q: "Qu'est-ce que l'émigration ?", a: "Le fait de quitter son pays (ici : le Luxembourg) pour s'installer ailleurs ; ce sont les personnes quittant le pays. (Formulation déduite du cours.)", src: "p. 37 ; Document 5" },
  { c: 5, star: 1, q: "Qu'est-ce que le solde migratoire ?", a: "Solde migratoire = Immigration − Émigration : la différence entre les personnes arrivant dans le pays et les personnes le quittant.", src: "p. 37" },
  { c: 5, q: "Que signifie un solde migratoire positif ? Négatif ?", a: "Positif : l'immigration est plus importante que l'émigration (plus d'arrivées que de départs). Négatif : plus de départs que d'arrivées.", src: "p. 37" },
  { c: 5, q: "Solde migratoire 2020 au Luxembourg ?", a: "22.490 arrivées − 14.870 départs = +7.620 personnes. Comparaison : naissances (6.459) − décès (4.609) = seulement +1.850.", src: "p. 37" },
  { c: 5, q: "Quelles ont été les vagues d'émigration luxembourgeoise ?", a: "Pays pauvre et rural avant la sidérurgie (milieu du XIXe s.) : XIIe s. vers la Transylvanie ; 1re moitié du XVIIIe s. vers le Banat ; XIXe s. jusqu'à la 1re Guerre mondiale vers l'outre-mer (États-Unis, Brésil, Argentine) et la France. Plus de 72.000 Luxembourgeois ont quitté le pays entre 1841 et 1891.", src: "Document 5" },
  { c: 5, q: "Pourquoi les Luxembourgeois ont-ils émigré au XIXe siècle ?", a: "Raisons économiques : population en hausse, parcelles agricoles qui rétrécissent, mauvaises vendanges, disparition des emplois du secteur artisanal face à la grande industrie.", src: "Document 5" },
  { c: 5, star: 1, q: "Quelles ont été les vagues d'immigration au Luxembourg ?", a: "1re vague (fin XIXe s.) : Italiens, attirés par la sidérurgie ; puis Portugais (2e moitié du XXe s.). 2e vague : Français, Belges, Britanniques, attirés par le secteur tertiaire.", src: "p. 36 ; Document 5" },
  { c: 5, q: "Quelle est la plus grande communauté étrangère au Luxembourg ?", a: "Les Portugais : 14,9 % de la population totale en 2021, suivis des Français (7,6 %), Italiens (3,7 %), Belges (3,1 %), Allemands (2,0 %). En 2021, plus de 47 % de résidents non luxembourgeois (2019 : plus de 46 %, Portugais 16,2 %).", src: "p. 36 ; Document 5 (2019)" },
  // 6
  { c: 6, q: "Que permet de déterminer la qualité du travail ?", a: "L'efficacité du travail. La formation des travailleurs est donc un élément important de la compétitivité d'une économie.", src: "p. 38" },
  { c: 6, star: 1, q: "Qu'est-ce que la compétitivité économique ?", a: "La capacité d'un pays, d'une économie ou d'une entreprise, à vendre durablement un ou plusieurs biens ou services marchands sur un marché donné en situation de concurrence.", src: "p. 38 (encadré)" },
  { c: 6, star: 1, q: "Qu'est-ce que la formation initiale ?", a: "La première formation d'un salarié avant son entrée sur le marché du travail. Au Luxembourg : enseignement fondamental (Cycle 1 – Cycle 4), enseignement secondaire (7e – 1e) ou formation professionnelle ; la formation universitaire est pour certains une dernière étape.", src: "p. 38" },
  { c: 6, star: 1, q: "Qu'est-ce que la formation continue ?", a: "La formation destinée aux adultes qui sont déjà entrés dans la vie active. Elle peut être financée par la personne concernée ou par l'entreprise ; sous conditions, les entreprises et l'État peuvent accorder une aide financière.", src: "p. 38" },
  { c: 6, q: "Pourquoi la formation continue est-elle indispensable ?", a: "Vu les évolutions rapides sur le marché du travail, elle est indispensable tout au long de la carrière professionnelle.", src: "p. 38" },
  { c: 6, q: "Niveau d'éducation par secteur (1er février 2011) : quels contrastes ?", a: "Autres services : 61,0 % d'enseignement supérieur ; activités financières et d'assurance : 52,3 % ; activités spécialisées : 42,8 % ; information et communication : 41,6 %. Construction : 31,9 % de niveau primaire ; agriculture : 55,0 % de secondaire supérieur.", src: "p. 39 (tableau)" },
];

    full: "Le graphique du STATEC compare le salaire minimum brut mensuel en avril 2022. Il est de 2.313,38 € au Luxembourg contre environ 1.600 à 1.660 € en Belgique, en Allemagne et en France : près de 44 % de plus qu'en France. Cette différence de rémunération explique en partie pourquoi tant de frontaliers viennent travailler au Luxembourg." },
  { id: "g7", img: "solde", title: "Solde migratoire (2000 – 2020)", facts: ["3.644 (2000) ; 2.649 (2002, minimum) ; 11.004 (2011) ; 11.159 (2015) ; 9.446 (2016) ; 11.075 (2019) ; 7.620 (2020)."],
    s: { titre: "Solde migratoire (immigration − émigration), 2000-2020 ; source : STATEC.", theme: "La différence entre les arrivées et les départs de personnes.", evol: "Toujours positif ; de 3.644 en 2000 à un niveau très élevé (10.000-11.000) à partir de 2011.", part: "Minimum en 2002 (2.649) ; saut en 2011 (11.004) ; forte baisse en 2020 (7.620).", comp: "Entre 2002 et 2011, le solde est multiplié par plus de quatre ; en 2020, il est inférieur d'environ 3.500 à celui de 2019 (11.075).", cause: "L'immigration accompagne le développement économique du pays (emplois dans les services, etc.).", conc: "Le Luxembourg est un pays d'immigration : sa population croît surtout grâce aux arrivées." },
    full: "Le graphique du STATEC présente le solde migratoire de 2000 à 2020. Il est positif chaque année : l'immigration dépasse l'émigration. Il passe de 2.649 en 2002 à plus de 11.000 en 2011 et reste très élevé jusqu'en 2019, avant de baisser à 7.620 en 2020. La croissance de la population luxembourgeoise repose donc largement sur l'immigration, liée au développement économique." },
];

// Aide : calcul (utilisé aussi par l'examen)
const FORMULAS = {
  taux: "Taux de chômage = (Nombre de chômeurs ÷ Population active) × 100",
  croiss: "Taux de croissance = [(Valeur N − Valeur N-1) ÷ Valeur N-1] × 100",
  nat: "Emploi national = Emploi intérieur − Frontaliers non-résidents + Frontaliers résidents",
  front: "Frontaliers non-résidents = Emploi intérieur + Résidents travaillant à l'étranger − Emploi national ; Part (%) = (Frontaliers ÷ Emploi intérieur) × 100",
  solde: "Solde migratoire = Immigration − Émigration",
};

// ───────── Générateurs de problèmes de calcul (entraînement + examen) ─────────
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rstep = (a, b, s) => a + s * rnd(0, Math.floor((b - a) / s));
const r2 = (x) => Math.round(x * 100) / 100;
const fi = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".").replace("-", "−");
const fd = (x, d = 2) => (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d).replace(".", ",").replace("-", "−");
const seven = (g, s, f, sub, c, r, i) => [
  "<b>1. Données :</b> " + g, "<b>2. Cherché :</b> " + s, "<b>3. Formule :</b> " + f, "<b>4. Substitution :</b> " + sub,
  "<b>5. Calcul :</b> " + c, "<b>6. Résultat :</b> " + r, "<b>7. Interprétation :</b> " + i,
];
const NOX100 = "Vous avez oublié de multiplier par 100 : un taux s'exprime en pourcentage.";
const WRONGDEN = "Vous avez divisé par la valeur d'arrivée. Pour un taux de croissance, on divise par la valeur de DÉPART (N-1).";

const P = {};

P.taux = (lv, fx) => {
  if (lv === 1) {
    const ch = fx?.ch ?? rstep(5000, 20000, 500), pa = fx?.pa ?? rstep(150000, 400000, 5000), t = r2(ch / pa * 100);
    return { title: "Taux de chômage (simple)", formula: FORMULAS.taux, text: `Un pays compte <b>${fi(ch)}</b> chômeurs et une population active de <b>${fi(pa)}</b> personnes. Calculez le taux de chômage.`,
      fields: [{ label: "Taux de chômage", ans: t, unit: "%", tol: 0.02, alts: [{ v: ch / pa, msg: NOX100 }, { v: ch / (pa + ch) * 100, msg: "Ici la population active est déjà donnée : ne rajoutez pas les chômeurs." }] }],
      steps: seven(`chômeurs = ${fi(ch)} ; population active = ${fi(pa)}`, "le taux de chômage", FORMULAS.taux, `(${fi(ch)} ÷ ${fi(pa)}) × 100`, `${fi(ch)} ÷ ${fi(pa)} = ${(ch / pa).toFixed(4).replace(".", ",")} ; × 100 = ${fd(t)}`, `<b>${fd(t)} %</b>`, `Environ ${fd(t, 1)} personnes actives sur 100 sont au chômage.`) };
  }
  if (lv === 2) {
    const occ = fx?.occ ?? rstep(150000, 350000, 5000), ch = fx?.ch ?? rstep(5000, 20000, 500), pa = occ + ch, t = r2(ch / pa * 100);
    return { title: "Taux de chômage (avec population active à reconstituer)", formula: FORMULAS.taux, text: `Un pays compte <b>${fi(occ)}</b> actifs occupés et <b>${fi(ch)}</b> chômeurs. Calculez d'abord la population active, puis le taux de chômage.`,
      fields: [{ label: "Population active", ans: pa, unit: "personnes", tol: 0.5, alts: [{ v: occ, msg: "Les chômeurs font partie de la population active : population active = occupés + chômeurs." }] },
        { label: "Taux de chômage", ans: t, unit: "%", tol: 0.02, alts: [{ v: r2(ch / occ * 100), msg: "Vous avez divisé par les actifs occupés. Le dénominateur est la population active (occupés + chômeurs)." }, { v: ch / pa, msg: NOX100 }] }],
      steps: seven(`actifs occupés = ${fi(occ)} ; chômeurs = ${fi(ch)}`, "population active, puis taux de chômage", "Population active = occupés + chômeurs ; " + FORMULAS.taux, `${fi(occ)} + ${fi(ch)} = ${fi(pa)} ; (${fi(ch)} ÷ ${fi(pa)}) × 100`, `${fi(ch)} ÷ ${fi(pa)} = ${(ch / pa).toFixed(4).replace(".", ",")} ; × 100 = ${fd(t)}`, `population active = <b>${fi(pa)}</b> ; taux = <b>${fd(t)} %</b>`, `Environ ${fd(t, 1)} actifs sur 100 sont au chômage.`) };
  }
  const pa1 = fx?.pa1 ?? rstep(250000, 330000, 5000), ch1 = fx?.ch1 ?? rstep(8000, 14000, 500), ch2 = fx?.ch2 ?? ch1 + rstep(2000, 7000, 500), pa2 = fx?.pa2 ?? pa1 + rstep(0, 6000, 1000);
  const t1 = r2(ch1 / pa1 * 100), t2 = r2(ch2 / pa2 * 100), dv = r2(t2 - t1);
  return { title: "Comparer deux périodes", formula: FORMULAS.taux, text: `Période 1 : <b>${fi(ch1)}</b> chômeurs pour une population active de <b>${fi(pa1)}</b>. Période 2 : <b>${fi(ch2)}</b> chômeurs pour <b>${fi(pa2)}</b> actifs. Calculez les deux taux et la variation en points de pourcentage.`,
    fields: [{ label: "Taux période 1", ans: t1, unit: "%", tol: 0.02, alts: [{ v: ch1 / pa1, msg: NOX100 }] }, { label: "Taux période 2", ans: t2, unit: "%", tol: 0.02, alts: [{ v: ch2 / pa2, msg: NOX100 }] }, { label: "Variation (période 2 − période 1)", ans: dv, unit: "points", tol: 0.03 }],
    steps: seven(`P1 : ${fi(ch1)} / ${fi(pa1)} ; P2 : ${fi(ch2)} / ${fi(pa2)}`, "les deux taux et leur différence", FORMULAS.taux, `(${fi(ch1)} ÷ ${fi(pa1)}) × 100 et (${fi(ch2)} ÷ ${fi(pa2)}) × 100`, `${fd(t1)} % et ${fd(t2)} % ; ${fd(t2)} − ${fd(t1)} = ${fd(dv)}`, `<b>${fd(t1)} %</b> ; <b>${fd(t2)} %</b> ; variation <b>${dv >= 0 ? "+" : ""}${fd(dv)} point(s)</b>`, dv >= 0 ? "Le chômage a augmenté entre les deux périodes." : "Le chômage a diminué entre les deux périodes.") };
};

P.croiss = (lv, fx) => {
  if (lv === 1 || lv === 2) {
    const v0 = fx?.v0 ?? rstep(100000, 400000, 10000);
    const v1 = fx?.v1 ?? (lv === 1 ? v0 + rstep(5000, 80000, 5000) : v0 - rstep(5000, 60000, 5000));
    const g = r2((v1 - v0) / v0 * 100);
    return { title: lv === 1 ? "Taux de croissance (hausse)" : "Taux de croissance (baisse)", formula: FORMULAS.croiss, text: `Le nombre d'emplois passe de <b>${fi(v0)}</b> (année N-1) à <b>${fi(v1)}</b> (année N). Calculez le taux de croissance.`,
      fields: [{ label: "Taux de croissance", ans: g, unit: "%", tol: 0.05, alts: [{ v: (v1 - v0) / v0, msg: NOX100 }, { v: r2((v1 - v0) / v1 * 100), msg: WRONGDEN }, { v: r2(Math.abs(g)), msg: g < 0 ? "Le résultat est négatif (baisse) : gardez le signe −." : null }] }],
      steps: seven(`N-1 = ${fi(v0)} ; N = ${fi(v1)}`, "le taux de croissance", FORMULAS.croiss, `[(${fi(v1)} − ${fi(v0)}) ÷ ${fi(v0)}] × 100`, `${fi(v1 - v0)} ÷ ${fi(v0)} = ${((v1 - v0) / v0).toFixed(4).replace(".", ",").replace("-", "−")} ; × 100 = ${fd(g)}`, `<b>${g >= 0 ? "+" : ""}${fd(g)} %</b>`, g >= 0 ? `L'emploi a augmenté de ${fd(g, 1)} % (${fi(v1 - v0)} emplois).` : `L'emploi a diminué de ${fd(Math.abs(g), 1)} % (${fi(Math.abs(v1 - v0))} emplois).`) };
  }
  const v0 = fx?.v0 ?? rstep(200000, 300000, 10000), v1 = fx?.v1 ?? v0 + rstep(5000, 30000, 5000), v2 = fx?.v2 ?? v1 + rstep(-10000, 40000, 5000);
  const g1 = r2((v1 - v0) / v0 * 100), g2 = r2((v2 - v1) / v1 * 100), gt = r2((v2 - v0) / v0 * 100);
  return { title: "Croissance sur plusieurs années", formula: FORMULAS.croiss, text: `Emploi : <b>${fi(v0)}</b> (année 1), <b>${fi(v1)}</b> (année 2), <b>${fi(v2)}</b> (année 3). Calculez le taux de croissance de l'année 1 à 2, de 2 à 3, puis sur l'ensemble de la période.`,
    fields: [{ label: "Année 1 → 2", ans: g1, unit: "%", tol: 0.05, alts: [{ v: (v1 - v0) / v0, msg: NOX100 }] }, { label: "Année 2 → 3", ans: g2, unit: "%", tol: 0.05, alts: [{ v: r2((v2 - v1) / v2 * 100), msg: WRONGDEN }] }, { label: "Année 1 → 3 (total)", ans: gt, unit: "%", tol: 0.05, alts: [{ v: r2(g1 + g2), msg: "Les taux de croissance ne s'additionnent pas : recalculez avec la valeur de départ (année 1) et la valeur d'arrivée (année 3)." }] }],
    steps: seven(`${fi(v0)} → ${fi(v1)} → ${fi(v2)}`, "trois taux de croissance", FORMULAS.croiss, `(${fi(v1)} − ${fi(v0)}) ÷ ${fi(v0)} ; (${fi(v2)} − ${fi(v1)}) ÷ ${fi(v1)} ; (${fi(v2)} − ${fi(v0)}) ÷ ${fi(v0)}`, `${fd(g1)} % ; ${fd(g2)} % ; ${fd(gt)} %`, `<b>${fd(g1)} %</b> ; <b>${fd(g2)} %</b> ; total <b>${fd(gt)} %</b>`, "On compare toujours à la valeur de départ de la période considérée ; les taux annuels ne s'additionnent pas.") };
};

P.nat = (lv, fx) => {
  if (lv === 1) {
    const i = fx?.i ?? rstep(300000, 480000, 5000), n = fx?.n ?? rstep(120000, 220000, 5000), r = fx?.r ?? rstep(5000, 15000, 500), nat = i - n + r;
    return { title: "Emploi national", formula: FORMULAS.nat, text: `Emploi intérieur : <b>${fi(i)}</b> ; frontaliers non-résidents : <b>${fi(n)}</b> ; frontaliers résidents : <b>${fi(r)}</b>. Calculez l'emploi national.`,
      fields: [{ label: "Emploi national", ans: nat, unit: "emplois", tol: 0.5, alts: [{ v: i - n - r, msg: "Les frontaliers RÉSIDENTS (qui travaillent à l'étranger) s'ajoutent : ils résident au Luxembourg." }, { v: i + n + r, msg: "Les frontaliers non-résidents sont à SOUSTRAIRE : ils ne résident pas au Luxembourg." }] }],
      steps: seven(`intérieur = ${fi(i)} ; non-résidents = ${fi(n)} ; résidents = ${fi(r)}`, "l'emploi national", FORMULAS.nat, `${fi(i)} − ${fi(n)} + ${fi(r)}`, `${fi(i)} − ${fi(n)} = ${fi(i - n)} ; + ${fi(r)} = ${fi(nat)}`, `<b>${fi(nat)} emplois</b>`, "Nombre d'emplois occupés par les personnes résidant au Luxembourg.") };
  }
  if (lv === 2) {
    const i = fx?.i ?? rstep(380000, 480000, 5000), r = fx?.r ?? rstep(8000, 14000, 500), nat = fx?.nat ?? i - rstep(150000, 215000, 5000), n = i + r - nat;
    return { title: "Retrouver les frontaliers non-résidents", formula: FORMULAS.front, text: `Emploi intérieur : <b>${fi(i)}</b> ; résidents travaillant à l'étranger ou pour des institutions internationales : <b>${fi(r)}</b> ; emploi national : <b>${fi(nat)}</b>. Calculez le nombre de frontaliers résidant à l'étranger et travaillant au Luxembourg.`,
      fields: [{ label: "Frontaliers non-résidents", ans: n, unit: "personnes", tol: 0.5, alts: [{ v: i - nat, msg: "Vous avez oublié d'ajouter les résidents travaillant à l'étranger / institutions internationales." }] }],
      steps: seven(`intérieur = ${fi(i)} ; résidents à l'étranger = ${fi(r)} ; national = ${fi(nat)}`, "les frontaliers non-résidents", "Intérieur + résidents à l'étranger − national", `${fi(i)} + ${fi(r)} − ${fi(nat)}`, `${fi(i)} + ${fi(r)} = ${fi(i + r)} ; − ${fi(nat)} = ${fi(n)}`, `<b>${fi(n)} frontaliers</b>`, `Environ ${fi(n)} personnes habitant à l'étranger viennent travailler chaque jour au Luxembourg.`) };
  }
  const i0 = fx?.i0 ?? rstep(250000, 280000, 5000), n0 = fx?.n0 ?? rstep(85000, 95000, 1000), r0 = fx?.r0 ?? rstep(8000, 9500, 500);
  const i1 = fx?.i1 ?? i0 + rstep(150000, 210000, 5000), n1 = fx?.n1 ?? n0 + rstep(100000, 125000, 1000), r1 = fx?.r1 ?? r0 + rstep(3000, 5000, 500);
  const a = i0 - n0 + r0, b = i1 - n1 + r1, g = r2((b - a) / a * 100);
  return { title: "Emploi national et croissance", formula: FORMULAS.nat + " ; " + FORMULAS.croiss, text: `Année 1 : intérieur <b>${fi(i0)}</b>, non-résidents <b>${fi(n0)}</b>, résidents <b>${fi(r0)}</b>. Année 2 : intérieur <b>${fi(i1)}</b>, non-résidents <b>${fi(n1)}</b>, résidents <b>${fi(r1)}</b>. Calculez l'emploi national des deux années et son taux de croissance.`,
    fields: [{ label: "Emploi national année 1", ans: a, unit: "", tol: 0.5 }, { label: "Emploi national année 2", ans: b, unit: "", tol: 0.5 }, { label: "Taux de croissance", ans: g, unit: "%", tol: 0.05, alts: [{ v: r2((i1 - i0) / i0 * 100), msg: "Vous avez calculé la croissance de l'emploi INTÉRIEUR ; demandé : emploi NATIONAL." }, { v: (b - a) / a, msg: NOX100 }] }],
    steps: seven("deux séries de valeurs", "emploi national (2 années) puis taux de croissance", FORMULAS.nat + " ; " + FORMULAS.croiss, `${fi(i0)} − ${fi(n0)} + ${fi(r0)} ; ${fi(i1)} − ${fi(n1)} + ${fi(r1)} ; (${fi(b)} − ${fi(a)}) ÷ ${fi(a)}`, `${fi(a)} ; ${fi(b)} ; ${fi(b - a)} ÷ ${fi(a)} = ${((b - a) / a).toFixed(4).replace(".", ",")} ; × 100`, `<b>${fi(a)}</b> ; <b>${fi(b)}</b> ; <b>${g >= 0 ? "+" : ""}${fd(g)} %</b>`, "L'emploi national a évolué de " + fd(g, 1) + " % entre les deux années.") };
};

P.front = (lv, fx) => {
  if (lv === 1) {
    const i = fx?.i ?? rstep(380000, 480000, 5000), f = fx?.f ?? Math.round(i * (0.38 + rnd(0, 10) / 100) / 1000) * 1000, p = r2(f / i * 100);
    return { title: "Part des frontaliers dans l'emploi intérieur", formula: "Part (%) = (Frontaliers ÷ Emploi intérieur) × 100", text: `Emploi intérieur : <b>${fi(i)}</b> ; frontaliers non-résidents : <b>${fi(f)}</b>. Quelle est la part des frontaliers dans l'emploi intérieur ?`,
      fields: [{ label: "Part des frontaliers", ans: p, unit: "%", tol: 0.05, alts: [{ v: f / i, msg: NOX100 }, { v: r2((i - f) / i * 100), msg: "Vous avez calculé la part des NON-frontaliers." }] }],
      steps: seven(`frontaliers = ${fi(f)} ; emploi intérieur = ${fi(i)}`, "la part des frontaliers (%)", "(Frontaliers ÷ Emploi intérieur) × 100", `(${fi(f)} ÷ ${fi(i)}) × 100`, `${fi(f)} ÷ ${fi(i)} = ${(f / i).toFixed(4).replace(".", ",")} ; × 100 = ${fd(p)}`, `<b>${fd(p)} %</b>`, `Environ ${fd(p, 0)} emplois sur 100 sont occupés par des frontaliers : forte dépendance de l'économie.`) };
  }
  if (lv === 2) {
    const fr = fx?.fr ?? rstep(90000, 110000, 1000), de = fx?.de ?? rstep(40000, 55000, 1000), be = fx?.be ?? rstep(40000, 55000, 1000), tot = fr + de + be, pf = r2(fr / tot * 100);
    return { title: "Répartition des frontaliers par pays", formula: "Part (%) = (Nombre du pays ÷ Total) × 100", text: `Frontaliers salariés : France <b>${fi(fr)}</b>, Allemagne <b>${fi(de)}</b>, Belgique <b>${fi(be)}</b>. Calculez le total, puis la part (en %) des frontaliers français.`,
      fields: [{ label: "Total", ans: tot, unit: "", tol: 0.5 }, { label: "Part de la France", ans: pf, unit: "%", tol: 0.05, alts: [{ v: fr / tot, msg: NOX100 }] }],
      steps: seven(`France ${fi(fr)}, Allemagne ${fi(de)}, Belgique ${fi(be)}`, "le total et la part de la France", "Part = (pays ÷ total) × 100", `${fi(fr)} + ${fi(de)} + ${fi(be)} ; (${fi(fr)} ÷ ${fi(tot)}) × 100`, `${fi(tot)} ; ${(fr / tot).toFixed(4).replace(".", ",")} × 100 = ${fd(pf)}`, `total <b>${fi(tot)}</b> ; France <b>${fd(pf)} %</b>`, "Plus de la moitié ou moins ? Comparez avec 50 % pour interpréter.") };
  }
  const f0 = fx?.f0 ?? rstep(80000, 95000, 1000), f1 = fx?.f1 ?? f0 + rstep(80000, 130000, 1000), i1 = fx?.i1 ?? rstep(430000, 480000, 5000);
  const g = r2((f1 - f0) / f0 * 100), pp = r2(f1 / i1 * 100);
  return { title: "Évolution et part des frontaliers", formula: FORMULAS.croiss + " ; Part = (frontaliers ÷ intérieur) × 100", text: `Les frontaliers passent de <b>${fi(f0)}</b> (année 1) à <b>${fi(f1)}</b> (année 2). L'emploi intérieur de l'année 2 est de <b>${fi(i1)}</b>. Calculez le taux de croissance des frontaliers et leur part dans l'emploi intérieur en année 2.`,
    fields: [{ label: "Taux de croissance des frontaliers", ans: g, unit: "%", tol: 0.05, alts: [{ v: (f1 - f0) / f0, msg: NOX100 }, { v: r2((f1 - f0) / f1 * 100), msg: WRONGDEN }] }, { label: "Part en année 2", ans: pp, unit: "%", tol: 0.05, alts: [{ v: f1 / i1, msg: NOX100 }] }],
    steps: seven(`f0 = ${fi(f0)} ; f1 = ${fi(f1)} ; intérieur année 2 = ${fi(i1)}`, "croissance et part", FORMULAS.croiss + " ; part = f1 ÷ intérieur × 100", `(${fi(f1)} − ${fi(f0)}) ÷ ${fi(f0)} ; ${fi(f1)} ÷ ${fi(i1)}`, `${fd(g)} % ; ${fd(pp)} %`, `croissance <b>${fd(g)} %</b> ; part <b>${fd(pp)} %</b>`, "Les frontaliers ont fortement augmenté et pèsent lourd dans l'emploi intérieur.") };
};

P.solde = (lv, fx) => {
  if (lv === 1) {
    const a = fx?.a ?? rstep(15000, 30000, 500), d = fx?.d ?? rstep(8000, 24000, 500), s = a - d;
    return { title: "Solde migratoire", formula: FORMULAS.solde, text: `Une année, un pays compte <b>${fi(a)}</b> arrivées (immigration) et <b>${fi(d)}</b> départs (émigration). Calculez le solde migratoire.`,
      fields: [{ label: "Solde migratoire", ans: s, unit: "personnes", tol: 0.5, alts: [{ v: d - a, msg: "Vous avez inversé : solde = immigration − émigration (arrivées − départs)." }, { v: a + d, msg: "On soustrait les départs aux arrivées, on ne les additionne pas." }] }],
      steps: seven(`immigration = ${fi(a)} ; émigration = ${fi(d)}`, "le solde migratoire", FORMULAS.solde, `${fi(a)} − ${fi(d)}`, `${fi(a)} − ${fi(d)} = ${fi(s)}`, `<b>${s >= 0 ? "+" : ""}${fi(s)} personnes</b>`, s >= 0 ? "Solde positif : l'immigration est plus importante que l'émigration." : "Solde négatif : il y a plus de départs que d'arrivées.") };
  }
  if (lv === 2) {
    const a = fx?.a ?? rstep(18000, 26000, 500), d = fx?.d ?? rstep(10000, 17000, 500), nb = fx?.nb ?? rstep(5500, 7000, 100), dc = fx?.dc ?? rstep(4000, 5200, 100);
    const s = a - d, sn = nb - dc, v = s + sn;
    return { title: "Solde migratoire, solde naturel et variation de la population", formula: FORMULAS.solde + " ; Solde naturel = naissances − décès", text: `Arrivées : <b>${fi(a)}</b> ; départs : <b>${fi(d)}</b> ; naissances : <b>${fi(nb)}</b> ; décès : <b>${fi(dc)}</b>. Calculez le solde migratoire, le solde naturel et la variation totale de la population.`,
      fields: [{ label: "Solde migratoire", ans: s, unit: "", tol: 0.5, alts: [{ v: d - a, msg: "Inversé : immigration − émigration." }] }, { label: "Solde naturel", ans: sn, unit: "", tol: 0.5 }, { label: "Variation totale", ans: v, unit: "", tol: 0.5 }],
      steps: seven("arrivées, départs, naissances, décès", "solde migratoire, solde naturel, variation", "solde migratoire + solde naturel", `${fi(a)} − ${fi(d)} ; ${fi(nb)} − ${fi(dc)}`, `${fi(s)} ; ${fi(sn)} ; ${fi(s)} + ${fi(sn)} = ${fi(v)}`, `<b>${fi(s)}</b> ; <b>${fi(sn)}</b> ; <b>${fi(v)}</b>`, `La part due à l'immigration (${fd(s / v * 100, 0)} %) montre l'importance des migrations pour la croissance de la population.`) };

};

      $("#flash").onclick = flip; $("#fcFlip").onclick = flip;
      $("#fcPrev").onclick = () => fcMove(-1); $("#fcNext").onclick = () => fcMove(1);
      $("#fcKnown").onclick = () => { S.cards["c" + fc.deck[fc.i]] = "known"; save(); fcMove(1, true); };

  // ───────────────── QUIZ ─────────────────
  const qz = { cat: 0, lvl: 0, n: 10, list: [], i: 0, score: 0, wrong: [], answered: false, sel: [] };
  function qzSetup() {
    const root = $("#v-quiz");
    root.innerHTML = `<h2>Quiz – Questions à choix multiples</h2><p class="muted">${QUIZ.length} questions · une ou plusieurs bonnes réponses (indiqué) · feedback immédiat avec explication.</p>
      <div class="card"><div class="toolbar"><label>Thème <select id="qzCat"><option value="0">Tous (mélange)</option>${CATS.map((c) => `<option value="${c.id}" ${qz.cat === c.id ? "selected" : ""}>${c.id}. ${esc(c.name)}</option>`).join("")}</select></label>
      <label>Niveau <select id="qzLvl"><option value="0">Tous</option><option value="1">1 – Connaissance</option><option value="2">2 – Compréhension</option><option value="3">3 – Application</option></select></label>
      <label>Nombre <select id="qzN"><option value="10">10</option><option value="20">20</option><option value="999">Toutes</option></select></label></div>
      <button id="qzGo">Commencer</button></div>`;
    $("#qzLvl").value = qz.lvl; $("#qzN").value = qz.n;
    $("#qzGo").onclick = () => {
      qz.cat = +$("#qzCat").value; qz.lvl = +$("#qzLvl").value; qz.n = +$("#qzN").value;
      let idx = QUIZ.map((_, i) => i).filter((i) => (!qz.cat || QUIZ[i].t === qz.cat) && (!qz.lvl || QUIZ[i].l === qz.lvl));
      if (!idx.length) { alert("Aucune question pour ce choix."); return; }
      qzStart(shuffle(idx).slice(0, qz.n));
    };
  }
  function qzStart(list) { qz.list = list; qz.i = 0; qz.score = 0; qz.wrong = []; qzShow(); }
  function qzShow() {
    const root = $("#v-quiz");
    if (qz.i >= qz.list.length) return qzEnd();
    const id = qz.list[qz.i], q = QUIZ[id]; qz.answered = false; qz.sel = [];
    const order = shuffle(q.o.map((_, i) => i));
    root.innerHTML = `<h2>Quiz</h2><div class="row"><span class="muted">Question ${qz.i + 1} / ${qz.list.length}</span><span class="chip">${esc(THEME[q.t])}</span><span class="chip">Niveau ${q.l}</span><span class="muted">Score : ${qz.score}</span></div>
      <div class="bar"><i style="width:${100 * qz.i / qz.list.length}%"></i></div>
      <div class="card"><p class="big">${esc(q.q)}</p>${q.m ? '<p class="note">Plusieurs réponses possibles — cochez toutes les bonnes.</p>' : ""}
      <div id="opts">${order.map((oi) => `<label class="opt" data-i="${oi}"><input type="${q.m ? "checkbox" : "radio"}" name="o" value="${oi}"><span>${esc(q.o[oi])}</span></label>`).join("")}</div>
      <div id="fb"></div><div class="row gap"><button id="qzOk">Valider</button><button id="qzNext" class="ghost" hidden>Question suivante →</button></div></div>`;
    $("#qzOk").onclick = () => {
      const sel = $$("#opts input:checked").map((x) => +x.value);
      if (!sel.length) return;
      const ok = sel.length === q.a.length && q.a.every((a) => sel.includes(a));
      qz.answered = true; if (ok) qz.score++; else qz.wrong.push(id);
      S.quiz["q" + id] = { ok: ok }; save();
      $$("#opts .opt").forEach((l) => { const i = +l.dataset.i, input = $("input", l); input.disabled = true;
        if (q.a.includes(i)) l.classList.add("right"); else if (sel.includes(i)) l.classList.add("wrong"); });
      $("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "ko"}"><b>${ok ? "✔ Correct !" : "✘ Pas tout à fait."}</b> ${esc(q.e)}${!ok && q.m ? " <i>(Bonnes réponses surlignées en vert.)</i>" : ""}</div>`;
      $("#qzOk").hidden = true; $("#qzNext").hidden = false; $("#qzNext").focus();
    };
    $("#qzNext").onclick = () => { qz.i++; qzShow(); };
  }
  function qzEnd() {
    const n = qz.list.length, pct = Math.round(100 * qz.score / n);
    const byT = {}; qz.list.forEach((id) => { const t = QUIZ[id].t; byT[t] = byT[t] || [0, 0]; byT[t][1]++; if (!qz.wrong.includes(id)) byT[t][0]++; });
    $("#v-quiz").innerHTML = `<h2>Résultat</h2><div class="card center"><div class="ring" style="--p:${pct}"><span>${qz.score}/${n}</span><small>${pct}%</small></div>
      <p>${pct >= 80 ? "Excellent !" : pct >= 60 ? "Bien, encore quelques points à consolider." : "À retravailler : relisez la fiche de synthèse puis recommencez."}</p>
      <table class="tbl"><tr><th>Thème</th><th>Réussite</th></tr>${Object.entries(byT).map(([t, v]) => `<tr><td>${esc(THEME[t])}</td><td>${v[0]}/${v[1]}</td></tr>`).join("")}</table>
      <div class="row center gap wrap">${qz.wrong.length ? `<button id="qzRetry">Rejouer mes erreurs (${qz.wrong.length})</button>` : ""}<button class="ghost" id="qzAgain">Nouveau quiz</button></div></div>`;
    if (qz.wrong.length) $("#qzRetry").onclick = () => qzStart(shuffle(qz.wrong));
    $("#qzAgain").onclick = qzSetup;
  }

  function kwOut(keys, txt) {
    const hits = keys.filter((k) => txt.includes(norm(k)));
    return `<p class="muted">Mots-clés trouvés : <b>${hits.length}/${keys.length}</b></p><div class="chips">${keys.map((k) => `<span class="chip ${hits.includes(k) ? "ok" : "low"}">${hits.includes(k) ? "✔" : "✘"} ${esc(k)}</span>`).join("")}</div>`;
  }

  // ───────────────── CALCULS ─────────────────
  const cl = { type: "taux", lvl: 1, p: null, fmt: false };
  function parseNum(s) { if (s == null) return NaN; s = String(s).trim().replace(/[\s  %]/g, "").replace(/−/g, "-").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", "."); return s === "" ? NaN : Number(s); }
  function calcNew() {
    cl.p = cl.lvl === 0 ? COURSE_PROBS[cl.type]() : P[cl.type](cl.lvl); calcRender();
  }
  function calcRender() {
    const root = $("#v-calc"), p = cl.p, rec = S.calc[cl.type] || { ok: 0, n: 0 };
    root.innerHTML = `<h2>Calculs économiques</h2><p class="muted">Nouveaux chiffres à chaque problème. Saisissez vos résultats (virgule ou point acceptés), puis vérifiez.</p>
      <div class="tabs">${CALC_TYPES.map((t) => `<button class="tab ${t.id === cl.type ? "on" : ""}" data-t="${t.id}">${t.name}</button>`).join("")}</div>
      <div class="tabs small">${[[1, "Simple"], [2, "Moyen"], [3, "Avancé"], [0, "Exemple du cours"]].map(([l, n]) => `<button class="tab ${l === cl.lvl ? "on" : ""}" data-l="${l}">${n}</button>`).join("")}</div>
      <div class="card"><div class="row"><b>${esc(p.title)}</b><span class="chip">${esc(CALC_TYPES.find((t) => t.id === cl.type).name)}</span><span class="muted">Réussis : ${rec.ok}/${rec.n}</span></div>
      ${cl.lvl === 0 ? `<p class="note">${esc(COURSE_LABEL[cl.type])}</p>` : ""}<p>${p.text}</p>
      <div class="fields">${p.fields.map((f, i) => `<label class="fld"><span>${esc(f.label)}</span>${f.select ? `<select data-f="${i}"><option value="">— choisir —</option>${f.select.map((o) => `<option>${esc(o)}</option>`).join("")}</select>` : `<input data-f="${i}" inputmode="decimal" autocomplete="off" placeholder="?"> <em>${esc(f.unit || "")}</em>`}<span class="res" data-r="${i}"></span></label>`).join("")}</div>
      <div class="row gap wrap"><button id="cChk">Vérifier</button><button class="ghost" id="cSol">Solution pas à pas</button><button class="ghost" id="cFor">Formule</button><button class="ghost" id="cNew">Nouveau problème</button></div>
      <div id="cFormula" class="formula" ${cl.fmt ? "" : "hidden"}>${esc(p.formula)}</div><div id="cOut"></div><div id="cSteps"></div></div>`;
    $$("#v-calc [data-t]").forEach((b) => (b.onclick = () => { cl.type = b.dataset.t; calcNew(); }));
    $$("#v-calc [data-l]").forEach((b) => (b.onclick = () => { cl.lvl = +b.dataset.l; calcNew(); }));
    $("#cNew").onclick = calcNew;
    $("#cFor").onclick = () => { cl.fmt = !cl.fmt; $("#cFormula").hidden = !cl.fmt; };
    $("#cSol").onclick = () => { $("#cSteps").innerHTML = `<div class="steps"><b>Solution pas à pas</b>${p.steps.map((s) => `<p>${s}</p>`).join("")}</div>`; };
    $("#cChk").onclick = () => {
      let all = true, msgs = [];
      p.fields.forEach((f, i) => {
        const el = $(`[data-f="${i}"]`), r = $(`[data-r="${i}"]`); let good = false;
        if (f.select) { good = el.value === f.ans; if (!el.value) { all = false; r.textContent = ""; return; } }
        else {
          const v = parseNum(el.value); if (isNaN(v)) { all = false; r.textContent = "?"; r.className = "res"; return; }
          good = Math.abs(v - f.ans) <= (f.tol || 0.01);
          if (!good && f.alts) { const a = f.alts.find((x) => x.msg && Math.abs(v - x.v) <= Math.max(f.tol || 0.01, Math.abs(x.v) * 0.002)); if (a) msgs.push(`<b>${esc(f.label)}</b> : ${esc(a.msg)}`); }
        }
        r.className = "res " + (good ? "ok" : "ko"); r.textContent = good ? "✔" : "✘ (attendu : " + (f.select ? f.ans : String(f.ans).replace(".", ",")) + ")";
        if (!good) all = false;
      });
      const complete = p.fields.every((f, i) => $(`[data-f="${i}"]`).value !== "");
      if (!complete) { $("#cOut").innerHTML = `<div class="fb ko">Complétez tous les champs.</div>`; return; }
      const rec = S.calc[cl.type] || (S.calc[cl.type] = { ok: 0, n: 0 }); rec.n++; if (all) rec.ok++; save();
      $("#cOut").innerHTML = all ? `<div class="fb ok"><b>✔ Bravo !</b> Pensez à rédiger l'interprétation du résultat.</div>` : `<div class="fb ko"><b>✘ Pas encore.</b> ${msgs.length ? "<br>" + msgs.join("<br>") : "Vérifiez la formule et les valeurs utilisées (ouvrez « Formule » ou la solution)."}</div>`;
    };
  }

    const hist = S.exam.history.slice(-5).reverse();
    $("#v-exam").innerHTML = `<h2>Examen blanc</h2><p class="muted">60 points · 60 minutes · tous les chapitres. Correction automatique des QCM et des calculs ; modèles et estimation par mots-clés pour les réponses rédigées.</p>
      <div class="grid">${Object.keys(EXAM).map((k) => `<div class="card"><b>${EXAM[k].name}</b><p class="muted">3 définitions · 2 questions de compréhension · 6 QCM · 3 exercices de calcul · analyse de document · interprétation de graphique · comparaison</p><button data-v="${k}">Démarrer</button></div>`).join("")}</div>
      <div class="card"><b>Barème</b><p class="muted">Définitions 9 · Compréhension 8 · QCM 6 · Calculs 15 · Document 8 · Graphique 8 · Comparaison 6 = 60 points</p></div>
      ${hist.length ? `<h3>Derniers essais</h3><table class="tbl"><tr><th>Date</th><th>Variante</th><th>Score</th></tr>${hist.map((x) => `<tr><td>${esc(x.d)}</td><td>${esc(x.v)}</td><td>${x.s}/60</td></tr>`).join("")}</table>` : ""}`;
    $$("#v-exam [data-v]").forEach((b) => (b.onclick = () => examStart(b.dataset.v)));
  }
  function examStart(v) {
    const E = EXAM[v]; ex.v = v; ex.done = false; ex.left = 3600; ex.items = [];
    let h = `<div class="stickybar"><b>${E.name}</b><span id="clock">60:00</span><button id="exFinish">Terminer et corriger</button></div>`;
    const sec = (t) => (h += `<h3 class="sec">${t}</h3>`);
    const openBlock = (id, pts, t, label, q, m, k, extra = "") => { ex.items.push({ id, kind: "open", pts, t, m, k }); h += `<div class="card" data-id="${id}"><div class="row"><b>${label}</b><span class="chip">${pts} pts</span><span class="chip">${esc(THEME[t])}</span></div>${extra}<p>${q}</p><textarea rows="${pts >= 8 ? 8 : 5}" placeholder="Votre réponse…"></textarea><div class="corr"></div></div>`; };
    sec("I. Définitions (3 × 3 points)");
    E.defs.forEach((d, i) => openBlock("d" + i, 3, d.t, `Définition ${i + 1}`, esc(d.q), d.m, d.k));
    sec("II. Questions de compréhension (2 × 4 points)");
    E.compr.forEach((q, i) => openBlock("c" + i, 4, QR_THEME[q.n], `Question ${i + 1}`, esc(q.q), q.a.join(" "), q.k));
    sec("III. QCM (6 × 1 point)");
    E.qcm.forEach((q, i) => { ex.items.push({ id: "q" + i, kind: "qcm", pts: 1, t: q.t, q });
      const order = shuffle(q.o.map((_, j) => j));
      h += `<div class="card" data-id="q${i}"><div class="row"><b>QCM ${i + 1}</b><span class="chip">1 pt</span></div><p>${esc(q.q)}</p>${q.m ? '<p class="note">Plusieurs réponses possibles.</p>' : ""}${order.map((j) => `<label class="opt" data-i="${j}"><input type="${q.m ? "checkbox" : "radio"}" name="q${i}" value="${j}"><span>${esc(q.o[j])}</span></label>`).join("")}<div class="corr"></div></div>`; });
    sec("IV. Exercices de calcul (3 × 5 points)");
    E.calc.forEach((p, i) => { ex.items.push({ id: "k" + i, kind: "calc", pts: 5, t: CALC_TYPES.find((c) => c.id === p.type).t, p });
      h += `<div class="card" data-id="k${i}"><div class="row"><b>Exercice ${i + 1} : ${esc(p.title)}</b><span class="chip">5 pts</span></div><p>${p.text}</p><div class="fields">${p.fields.map((f, j) => `<label class="fld"><span>${esc(f.label)}</span>${f.select ? `<select data-f="${j}"><option value="">— choisir —</option>${f.select.map((o) => `<option>${esc(o)}</option>`).join("")}</select>` : `<input data-f="${j}" inputmode="decimal" autocomplete="off"> <em>${esc(f.unit || "")}</em>`}<span class="res" data-r="${j}"></span></label>`).join("")}</div><details><summary>Formules</summary><p class="formula">${esc(p.formula)}</p></details><div class="corr"></div></div>`; });
    sec("V. Analyse de document (8 points)");
    openBlock("doc", 8, E.doc.t, E.doc.title, E.doc.qs.map(esc).join("<br>"), E.doc.m, E.doc.k, (E.doc.img ? `<img class="gimg" src="${IMG[E.doc.img]}" alt="carte">` : "") + `<div class="docbox">${esc(E.doc.text)}</div>`);
    sec("VI. Interprétation de graphique (8 points)");
    const g = E.graph; openBlock("gr", 8, E.graphT, esc(g.title), "Décrivez et interprétez le graphique (titre/période, évolution, particularités, chiffres, causes, conclusion).", g.full, EXG_K[g.id] || [], `<img class="gimg" src="${IMG[g.img]}" alt="${esc(g.title)}">`);
    sec("VII. Comparaison de notions (6 points)");
    openBlock("cmp", 6, E.comp.t, "Comparaison", esc(E.comp.q), E.comp.m, E.comp.k);
    $("#v-exam").innerHTML = h;
    $("#exFinish").onclick = () => { if (confirm("Terminer l'examen et afficher la correction ?")) examFinish(); };
    const clock = $("#clock");
    ex.timer = setInterval(() => { ex.left--; const m = Math.floor(Math.max(0, ex.left) / 60), s = Math.max(0, ex.left) % 60; clock.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; if (ex.left <= 300) clock.classList.add("late"); if (ex.left <= 0) { clearInterval(ex.timer); examFinish(); } }, 1000);
    window.scrollTo({ top: 0 });
  }
  function examFinish() {
    if (ex.done) return; ex.done = true; clearInterval(ex.timer); ex.timer = null;
    const byT = {}; let total = 0;
    const addT = (t, e, p) => { byT[t] = byT[t] || [0, 0]; byT[t][0] += e; byT[t][1] += p; };
    ex.items.forEach((it) => {
      const card = $(`[data-id="${it.id}"]`), corr = $(".corr", card); let earned = 0;
      if (it.kind === "open") {
        const txt = norm($("textarea", card).value), hits = it.k.filter((k) => txt.includes(norm(k)));
        earned = Math.min(it.pts, Math.round(it.pts * (hits.length / it.k.length) * 2) / 2);
        corr.innerHTML = `<div class="fb ${earned >= it.pts * 0.7 ? "ok" : "ko"}"><b>Estimation automatique : <input class="ov" type="number" min="0" max="${it.pts}" step="0.5" value="${earned}" style="width:4.5em"> / ${it.pts}</b> <span class="muted">(ajustez selon la comparaison avec le modèle)</span>${kwOut(it.k, txt)}<div class="model"><b>Réponse modèle</b><p>${esc(it.m)}</p></div></div>`;
        $(".ov", card).addEventListener("input", () => examTotal());
      } else if (it.kind === "qcm") {
        const sel = $$("input:checked", card).map((x) => +x.value), ok = sel.length === it.q.a.length && it.q.a.every((a) => sel.includes(a)); earned = ok ? 1 : 0;
        $$(".opt", card).forEach((l) => { const i = +l.dataset.i; if (it.q.a.includes(i)) l.classList.add("right"); else if (sel.includes(i)) l.classList.add("wrong"); $("input", l).disabled = true; });
        corr.innerHTML = `<div class="fb ${ok ? "ok" : "ko"}"><b>${ok ? "✔" : "✘"}</b> ${esc(it.q.e)}</div><span class="earn" hidden>${earned}</span>`;
      } else {
        const p = it.p, per = it.pts / p.fields.length; let good = 0;
        p.fields.forEach((f, j) => { const el = $(`[data-f="${j}"]`, card), r = $(`[data-r="${j}"]`, card); let ok;
          if (f.select) ok = el.value === f.ans; else { const v = parseNum(el.value); ok = !isNaN(v) && Math.abs(v - f.ans) <= (f.tol || 0.01); }
          if (ok) good++; r.className = "res " + (ok ? "ok" : "ko"); r.textContent = ok ? "✔" : "✘ (attendu : " + (f.select ? f.ans : String(f.ans).replace(".", ",")) + ")"; el.disabled = true; });
        earned = Math.round(good * per * 2) / 2;
        corr.innerHTML = `<div class="fb ${good === p.fields.length ? "ok" : "ko"}"><b>${earned} / ${it.pts} points</b><div class="steps">${p.steps.map((s) => `<p>${s}</p>`).join("")}</div></div><span class="earn" hidden>${earned}</span>`;
      }
      it.earned = earned;
    });
    examTotal(true);
    window.scrollTo({ top: 0 });
  }
  function examTotal(first) {
    let total = 0; const byT = {};
    ex.items.forEach((it) => {
      const card = $(`[data-id="${it.id}"]`), ov = $(".ov", card);
      const e = ov ? Math.min(it.pts, Math.max(0, parseFloat(ov.value) || 0)) : it.earned; it.earned = e; total += e;
      byT[it.t] = byT[it.t] || [0, 0]; byT[it.t][0] += e; byT[it.t][1] += it.pts;
    });
    total = Math.round(total * 2) / 2;
    let box = $("#exResult"); if (!box) { box = document.createElement("div"); box.id = "exResult"; $("#v-exam").prepend(box); }
    const pct = Math.round(100 * total / 60);
    const rows = Object.keys(byT).sort().map((t) => { const p = Math.round(100 * byT[t][0] / byT[t][1]); return `<tr><td>${esc(THEME[t])}</td><td>${byT[t][0]}/${byT[t][1]}</td><td><div class="bar sm"><i style="width:${p}%"></i></div></td><td><span class="chip ${p >= 75 ? "ok" : p >= 50 ? "mid" : "low"}">${p >= 75 ? "Point fort" : p >= 50 ? "À consolider" : "À revoir"}</span></td></tr>`; }).join("");
    const weak = Object.keys(byT).filter((t) => byT[t][0] / byT[t][1] < 0.5).map((t) => THEME[t]);
    box.innerHTML = `<div class="card result"><h2>Résultat : ${total} / 60 (${pct}%)</h2><p>${pct >= 80 ? "Très bien : vous maîtrisez le chapitre." : pct >= 60 ? "Satisfaisant : consolidez les points signalés." : "Insuffisant : relisez la fiche de synthèse et refaites fiches et quiz."}</p>
      <table class="tbl"><tr><th>Thème</th><th>Points</th><th></th><th>Évaluation</th></tr>${rows}</table>
      <p><b>Stratégie :</b> ${weak.length ? "revoyez en priorité " + weak.map(esc).join(" ; ") + "." : "continuez avec une autre variante pour vérifier votre régularité."}</p>
      <div class="row gap wrap"><button id="exSave">Enregistrer ce résultat</button><button class="ghost" id="exBack">Retour aux variantes</button></div></div>`;
    $("#exSave").onclick = () => { S.exam.history.push({ d: new Date().toLocaleDateString("fr-FR"), v: EXAM[ex.v].name, s: total }); if (total > (S.exam.best || 0)) S.exam.best = total; save(); $("#exSave").disabled = true; $("#exSave").textContent = "Enregistré ✔"; };
    $("#exBack").onclick = examSetup;
  }

  // ── Démarrage
  fcBuild(); qzSetup(); exosRender(); calcNew(); graphsRender(); qrRender(); examSetup();
  const first = (location.hash || "").replace("#", "");
  show(VIEWS.includes(first) ? first : "dash");
})();
</script></body></html>
