    },

/* ---- assemblage d'une part (enveloppe commune) ---- */
function buildPart(spec) {
  const impl = PARTS[spec.t](spec);
  const fb = h('div', { class: 'pfb' });
  let figHost = null;
  if (spec.fig) { figHost = h('div', { class: 'pfig' }); spec.fig(figHost); }
  const el = h('div', { class: 'part' }, spec.q ? h('div', { class: 'pq', html: T(spec.q) }) : null, figHost, impl.body, fb);
  const part = Object.assign({ spec, el, fb }, impl);
  part.mark = (res, withAns) => {
    el.classList.toggle('ok', res.score === 1); el.classList.toggle('ko', res.score < 1 && !res.empty); el.classList.toggle('partial', res.score > 0 && res.score < 1);
    fb.innerHTML = '';
    if (res.score === 1) fb.append(h('div', { class: 'fbok' }, '✓ Correct.', spec.ok ? h('span', { html: ' ' + T(spec.ok) }) : null));
    else if (res.msg) fb.append(h('div', { class: 'fbko', html: '✗ ' + T(res.msg) }));
    if (withAns) { fb.append(h('div', { class: 'fbans' }, h('b', null, 'Réponse attendue : '), h('span', { html: part.ansHtml() }))); }
    if (withAns && spec.sol) fb.append(h('div', { class: 'fbsol', html: T(spec.sol) }));
  };
  part.reset = () => { part.clear(); el.classList.remove('ok', 'ko', 'partial'); fb.innerHTML = ''; };
  return part;
}

}

const tEq = topic({
  id: 'equation', ch: 2, n: '2.2', title: 'Équation du second degré : a, b, c', icon: 'ax²',
  lesson: `<div class="rule"><b class="t">Définition</b>Une équation du <b>second degré</b> à une inconnue $x$ s’écrit sous la <b>forme normale</b> $$ax^2+bx+c=0$$ où $a$, $b$, $c$ sont des réels donnés avec $a\\neq0$. (Le plus grand exposant de $x$ est 2.)</div>
  <div class="rule ex"><b class="t">Méthode — mettre sous forme normale</b><ol class="steps"><li>Développe les parenthèses.</li><li>Passe <b>tous</b> les termes dans le même membre (change le signe de ceux qui traversent le « = »), pour avoir 0 de l’autre côté.</li><li>Regroupe les termes en $x^2$, en $x$ et les constantes.</li><li>Lis $a$, $b$, $c$ <b>avec leur signe</b>. Terme absent ⇒ coefficient $0$.</li></ol>
  Exemple : $3x^2+3x=2x^2-9x+7 \\iff 3x^2-2x^2+3x+9x-7=0 \\iff x^2+12x-7=0$ : $a=1$, $b=12$, $c=-7$.</div>
  <div class="rule warn"><b class="t">Attention</b>$x^2-4+3x=2x^2-x$ donne $-x^2+4x-4=0$ : $a=-1$ (négatif !). Dans $2x-x^2=0$ : $a=-1$, $b=2$, $c=0$.</div>`
});
