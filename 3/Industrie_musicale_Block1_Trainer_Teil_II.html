<header><h1>🎵 Industrie musicale – Interaktiver Trainer (Teil II)</h1><p>3e GPM · Block 1, Kapitel 1 · Fragen, Karteikarten, Statistik, Guardian-Test und Prüfungssimulation · funktioniert offline</p></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const D={"MC": [["Welche drei Säulen bilden die Musikindustrie?", ["Recorded Music, Publishing, Live-Entertainment", "Streaming, CD, Vinyl", "Labels, Radio, Fernsehen"], 0, "Tonträger-/Digitalmarkt, Musikverlagswesen und Live-Entertainment sind die drei primären Säulen."], ["Zu welcher Säule gehören die Master Rights?", ["Publishing", "Live-Entertainment", "Recorded Music", "Verwertungsgesellschaften"], 2, "Recorded Music verwertet die Leistungsschutzrechte an Tonaufnahmen (Master Rights)."], ["Wofür werden Synchronisationsrechte benötigt?", ["Für Konzertkarten", "Für die Nutzung von Musik in Film und Werbung", "Für Streaming-Abonnements"], 1, "Sie gehören zum Publishing und betreffen die Komposition."], ["Womit verdient Live-Entertainment primär Geld?", ["Lizenzen und Abos", "Downloads", "Ticketverkäufe, Sponsoring, Merchandising"], 2, "Das sind die im Leitfaden genannten Einnahmen."], ["Was ist die SACEM?", ["Eine Verwertungsgesellschaft in Luxemburg/Frankreich", "Ein Streaming-Dienst", "Ein Instrumentenhersteller"], 0, "GEMA/GVL (Deutschland) und SACEM (Luxemburg/Frankreich) sind Verwertungsgesellschaften."], ["Welche Reihenfolge der Phasen ist richtig?", ["Napster → CD → iTunes → Streaming", "CD-Blüte → Tauschbörsen → legale Downloads → Streaming", "iTunes → Napster → CD → Streaming"], 1, "Späte 1990er CD, dann Napster, dann iTunes, heute Streaming."], ["Was kennzeichnet das Premium-Modell?", ["Gratis mit Werbung", "Einmalkauf einer Datei", "Monatliche Gebühr für werbefreien, unbegrenzten Zugang"], 2, "Premium = Abonnement."], ["Was gilt für Freemium?", ["Werbung finanziert den Zugang, Auszahlungen sind signifikant geringer", "Der Nutzer erwirbt eine dauerhafte Kopie", "Es gibt keine Auszahlungen"], 0, "Freemium: kostenlos für Nutzer, geringere Auszahlungsraten für Künstler."], ["Was unterscheidet einen Download vom Streaming?", ["Beim Download erwirbt man eine permanente digitale Kopie", "Download ist immer kostenlos", "Streaming speichert dauerhaft"], 0, "Streaming erzeugt keine dauerhafte Kopie beim Nutzer."], ["Wie hoch war der Umsatzanteil von Audio-/Video-Streaming 2025?", ["24,1 %", "84,4 %", "7,2 %", "53,8 %"], 1, "BVMI 2025."], ["Wofür steht 24,1 %?", ["Audio-/Video-Streaming 2025", "CD-Anteil 2025", "Audio-Streaming 2016", "Vinyl-Anteil 2016"], 2, "2016 hatte Audio-Streaming 24,1 % Anteil; die CD 53,8 %."], ["Was trifft auf die CD 2025 zu?", ["7,2 % Anteil, Rückgang um 11,3 %, zweitstärkstes Format", "6,3 % Anteil, Wachstum um 2,8 %", "1,4 % Anteil, wichtigstes Format"], 0, "Die CD bleibt vor Vinyl zweitstärkstes Format."], ["Wie ist zu erklären, dass der Vinyl-Umsatz stieg, obwohl der Absatz leicht sank?", ["Es wurden mehr höherwertige Editionen verkauft", "Vinyl wurde billiger", "Der Absatz stieg ebenfalls"], 0, "BVMI: Zunahme höherwertiger Editionen (Absatz −2,4 %, Umsatz +2,8 %)."], ["Welche Aussage über Vinyl und CD 2025 ist richtig?", ["Vinyl (6,3 %) überholt die CD (7,2 %)", "Vinyl (6,3 %) liegt knapp hinter der CD (7,2 %)", "Vinyl hat mehr Anteil als Streaming"], 1, "Der Abstand zwischen CD und Vinyl wird kleiner, aber die CD liegt noch vorn."], ["Was bedeutet der Wechsel zu Mikrozahlungen für Künstler?", ["Mehr punktuelle hohe Einnahmen", "Kontinuierliche, aber extrem geringe Zahlungen pro Stream", "Keine Veränderung"], 1, "Leitfaden: Verlagerung von punktuellen Albumeinnahmen zu Mikrozahlungen."], ["Was sind Tantiemen?", ["Eintrittspreise bei Konzerten", "Laufende Nutzungsvergütungen für Urheber", "Werbeeinnahmen von Labels"], 1, "Gewinnbeteiligungen/Nutzungsvergütungen für Komponisten und Textdichter."], ["Was ist Big Data / Data Intelligence?", ["Auswertung riesiger Datenmengen für Marketing- und A&R-Entscheidungen", "Ein Streaming-Tarif", "Ein Mastering-Verfahren"], 0, "Beispiel: Nutzerverhalten auf Spotify."], ["Welches ist ein im Leitfaden genannter KI-Einsatz?", ["Vinylpressung", "Zielgruppengenaues Marketing durch Analyse gigantischer Datensätze", "Konzertbuchung"], 1, "Kompositionen, Produktion/Mastering, Marketing."], ["Welche Programme nennt der Leitfaden als DAWs?", ["Ableton Live und Logic Pro", "GEMA und SACEM", "Napster und iTunes"], 0, "DAW = Digital Audio Workstation."], ["Was gilt für die HMG?", ["Gegründet 1834, drittälteste Musikgesellschaft des Landes", "Gegründet 1934, älteste Musikgesellschaft", "Ein Streaming-Dienst"], 0, "Rund 50 aktive Mitglieder, Galakonzert im Centre Machera."], ["Was bietet die Ecole Régionale de Musique Grevenmacher an?", ["Nur klassische Instrumente", "Klassische und moderne Instrumente sowie Schauspiel und Tanz", "Nur Streaming-Kurse"], 1, "Klavier, Gesang, E-Gitarre, Schlagzeug, Schauspiel, zeitgenössischer Tanz."], ["Wer vergleicht im Guardian Streaming mit Miete?", ["Ed", "Neil Cumming", "Asha Varadharajan", "Andrew Wales"], 1, "Cumming: Streaming bedeutet im Grunde Mieten; Titel können verschwinden."], ["Warum darf man Guardian-Zahlen nicht mit BVMI-Marktanteilen gleichsetzen?", ["Sie stammen aus anderen Märkten und Quellen (Großbritannien/Fans bzw. Deutschland/Marktstatistik)", "Der Guardian hat sich geirrt", "Sie sind identisch"], 0, "BVMI misst den deutschen Markt; der Guardian berichtet britische Angaben und Erfahrungen."], ["Was zeigt das Wachstum von Streaming (+400 %) und Vinyl (+117 %) in zehn Jahren?", ["Digital und physisch schließen sich nicht aus", "Vinyl ersetzt Streaming", "Streaming ist rückläufig"], 0, "BVMI: Beides wuchs parallel."]], "OPEN": [["Definiere die Musikindustrie.", ["Die Musikindustrie ist die Gesamtheit aller Unternehmen, Institutionen und selbstständigen Akteure, die an Schöpfung, Produktion, rechtlicher Verwertung, Distribution und Vermarktung von Musikwerken sowie deren Aufführung beteiligt sind.", "Sie ist ein Teilsektor der Kultur- und Kreativwirtschaft; ihr Kern ist die Monetarisierung von Urheberrechten, Leistungsschutzrechten und Live-Erlebnissen."]], ["Nenne die drei Säulen und erkläre jede in einem Satz.", ["Recorded Music: Labels, Vertriebe, Plattformen; verwertet die Master Rights an Aufnahmen.", "Publishing: Verlage vertreten Komponisten und Textdichter und lizenzieren die Urheberrechte an der Komposition (z. B. Synchronisationsrechte).", "Live-Entertainment: Veranstalter, Agenturen, Venues, Festivals; Einnahmen über Tickets, Sponsoring, Merchandising."]], ["Was sind Verwertungsgesellschaften? Nenne drei Beispiele.", ["Sie setzen kollektive Vergütungsansprüche treuhänderisch durch.", "GEMA und GVL (Deutschland), SACEM (Luxemburg/Frankreich)."]], ["Beschreibe die Entwicklung der Vertriebsmodelle seit den späten 1990er Jahren.", ["Einleitung: Übergang von physischen Tonträgern zur digitalen Distribution, größter Paradigmenwechsel.", "Späte 1990er: Blütezeit der CD. Danach disruptive illegale Tauschbörsen (Napster). Dann legaler Download-Markt (iTunes). Heute Dominanz des Streamings.", "Folge: Streaming, Downloads und Online-Plattformen revolutionieren den Musikkonsum; Künstler erhalten Mikrozahlungen."]], ["Erkläre den Unterschied zwischen Premium und Freemium.", ["Premium: monatliche Gebühr, werbefrei, unbegrenzter Zugang.", "Freemium: kostenlos, durch Werbung finanziert, Auszahlungsraten an Künstler signifikant geringer."]], ["Was unterscheidet einen Download vom Streaming?", ["Download: permanente digitale Kopie wird erworben (Einzelkauf).", "Streaming: kontinuierliche Übertragung, keine dauerhafte Kopie beim Nutzer."]], ["Beschreibe die Unterschiede in der Monetarisierung: Abo, Freemium, klassischer CD-Verkauf.", ["Abo: Gebühr des Nutzers, laufende kleine Zahlungen pro Stream.", "Freemium: Werbung finanziert; Auszahlungen signifikant geringer.", "CD: einmaliger Verkauf, punktuell höhere Einnahme; Käufer besitzt das Produkt."]], ["Was sind Tantiemen?", ["Laufende Gewinnbeteiligungen oder Nutzungsvergütungen für Urheber (Komponisten, Textdichter) für die Nutzung ihrer geschützten Werke."]], ["Welche Bedeutung haben Big Data und Data Intelligence?", ["Sammlung und Auswertung riesiger Datenmengen (z. B. Nutzerverhalten auf Spotify).", "Bedeutung: fundierte wirtschaftliche Entscheidungen in Marketing und A&R; zielgruppengenaue Kampagnen."]], ["Nenne den Gesamtumsatz 2025 und die vier Formatanteile.", ["2,42 Mrd. € (siebtes Wachstumsjahr in Folge).", "Audio-/Video-Streaming 84,4 %, CD 7,2 %, Vinyl 6,3 %, Downloads 1,4 %."]], ["Erkläre, warum der Vinyl-Umsatz steigen kann, obwohl der Absatz leicht sinkt.", ["Umsatz 2025 +2,8 % (152 Mio. €), Absatz −2,4 % (4,5 Mio. Stück).", "Ursache laut BVMI: Zunahme höherwertiger Editionen, also höhere Erlöse pro verkaufter Platte."]], ["Erkläre den Wandel der Einkommensstruktur der Künstler.", ["Früher punktuell hohe Einnahmen durch Albumverkäufe.", "Heute kontinuierliche, aber extrem geringe Mikrozahlungen pro Stream.", "Ursache: Digitalisierung, Streaming-Dominanz (84,4 %)."]], ["Nenne die drei KI-Einsatzfelder aus dem Leitfaden.", ["Kompositionen algorithmisch generieren oder unterstützen.", "Produktion und Mastering durch automatisierte Audio-Analysen optimieren.", "Marketingkampagnen durch Analyse von Big Data zielgruppengenau aussteuern."]], ["Was ist eine DAW? Nenne zwei Beispiele.", ["Digital Audio Workstation, Musikproduktionsprogramm.", "Beispiele: Ableton Live, Logic Pro."]], ["Was ist die HMG? Nenne drei Fakten und das Nachwuchsprogramm.", ["Harmonie Municipale de la Ville de Grevenmacher.", "Gegründet 1834, drittälteste Musikgesellschaft des Landes, rund 50 aktive Mitglieder, Galakonzert im Centre Machera.", "Nachwuchsprogramm „Noutewënzer“ für Kinder ab 9 Jahren."]], ["Welche Rolle spielt die Ecole Régionale de Musique Grevenmacher?", ["Vermittelt klassische und moderne Instrumente, Schauspiel und zeitgenössischen Tanz.", "Regionale Basisarbeit als Fundament für spätere professionelle Karrieren in der Musikindustrie."]], ["Warum bleibt regionale Musik trotz globalem Streaming wichtig?", ["Streaming macht Musik global verfügbar, aber die lokale Verwurzelung bleibt für den sozialen Zusammenhalt essenziell.", "Beispiele: HMG (Tradition, Nachwuchs), Ecole Régionale (Ausbildung), Kulturhuef Kino (Kulturverständnis)."]]], "FC": [["Drei Säulen der Musikindustrie?", "Recorded Music, Publishing, Live-Entertainment"], ["Recorded Music", "Tonträger- und Digitalmarkt: Labels, Vertriebe, Plattformen; verwertet Master Rights"], ["Publishing", "Musikverlagswesen: Urheberrechte an der Komposition, Lizenzierung, z. B. Synchronisationsrechte"], ["Live-Entertainment", "Veranstalter, Booking, Venues, Festivals; Einnahmen aus Tickets, Sponsoring, Merchandising"], ["GEMA, GVL, SACEM", "Verwertungsgesellschaften; GEMA/GVL Deutschland, SACEM Luxemburg/Frankreich"], ["Vier Phasen des Wandels", "CD-Blüte → Tauschbörsen (Napster) → legale Downloads (iTunes) → Streaming"], ["Premium", "Abo: monatliche Gebühr, werbefrei, unbegrenzter Zugang"], ["Freemium", "Gratis mit Werbung; Auszahlungen an Künstler signifikant geringer"], ["Download", "Einzelkauf einer permanenten digitalen Kopie"], ["Gesamtumsatz 2025", "2,42 Mrd. €, siebtes Wachstumsjahr in Folge"], ["Streaming-Anteil 2025", "84,4 % (Audio-/Video-Streaming), über 2 Mrd. €"], ["CD 2025", "7,2 %, Rückgang um 11,3 %, zweitstärkstes Format"], ["Vinyl 2025", "6,3 %, Wachstum um 2,8 %"], ["Downloads 2025", "1,4 %"], ["2016: Audio-Streaming und CD", "Audio-Streaming 24,1 %, CD 53,8 %"], ["Vinyl: Umsatz und Absatz 2025", "Umsatz +2,8 %, Absatz −2,4 % wegen höherwertiger Editionen (BVMI)"], ["Mikrozahlungen", "Extrem geringe, kontinuierliche Zahlungen pro Stream statt punktueller Albumeinnahmen"], ["Tantiemen", "Laufende Nutzungsvergütung für Urheber"], ["Big Data / Data Intelligence", "Auswertung riesiger Datenmengen für Marketing und A&R"], ["KI-Einsatzfelder", "Komposition, Produktion/Mastering, Marketing mit Big Data"], ["DAW-Beispiele", "Ableton Live, Logic Pro"], ["HMG", "1834 gegründet, drittälteste Musikgesellschaft, ~50 Mitglieder, Galakonzert im Centre Machera"], ["Noutewënzer", "Nachwuchsprogramm für Kinder ab 9 Jahren"], ["Ecole Régionale de Musique", "Klassische und moderne Instrumente, Schauspiel, Tanz; Basis für Karrieren"], ["Kulturhuef Kino", "Sonderveranstaltungen und Filmkunst; prägt Kulturverständnis"], ["Cumming (Guardian)", "Direktkauf bei kleinen Bands, Streaming = Miete, Ritual; Streaming zum Entdecken"], ["Varadharajan (Guardian)", "Album als Erzählbogen, Gegenteil vom Scrollen, Algorithmen machen alles vorhersehbar"]], "STAT": [["Ordne die Umsatzanteile 2025 zu: Audio-/Video-Streaming, CD, Vinyl, Downloads. Gesamtumsatz?", ["Audio-/Video-Streaming 84,4 %, CD 7,2 %, Vinyl 6,3 %, Downloads 1,4 %.", "Gesamtumsatz 2,42 Mrd. €."], 3], ["Rechne: Der digitale Anteil ergibt sich aus Streaming plus Downloads. Wie hoch ist er?", ["84,4 % + 1,4 % = 85,8 % (BVMI: digitaler Marktanteil 85,8 %)."], 2], ["Der physische Anteil beträgt 14,2 %. CD und Vinyl zusammen? Wie viel Prozent bleiben für sonstige physische Formate?", ["7,2 % + 6,3 % = 13,5 %. 14,2 % − 13,5 % = 0,7 % sonstige physische Formate (Singles, MC, DVD-Audio, SACD, Blu-ray usw.)."], 3], ["Um wie viele Prozentpunkte sank der CD-Anteil von 2016 (53,8 %) auf 2025 (7,2 %)?", ["53,8 − 7,2 = 46,6 Prozentpunkte."], 2], ["Welche Formate verzeichneten 2025 beim Umsatz Wachstum, welche einen Rückgang?", ["Wachstum: Streaming (BVMI: +4,1 %; Audio-Streaming +3,8 %) und Vinyl (+2,8 %).", "Rückgang: CD (−11,3 %), Downloads (−9,0 %, BVMI)."], 3], ["Warum darf man 24,1 % (Audio-Streaming 2016) nicht direkt mit 84,4 % (2025) vergleichen?", ["24,1 % betrifft nur Audio-Streaming, 84,4 % umfasst Audio- und Video-Streaming zusammen. Der Anstieg wäre sonst überzeichnet.", "Audio-Streaming allein erzielte 2025 1.930 Mio. €. Man vergleicht entweder Audio mit Audio oder nennt beide Kategorien ausdrücklich."], 4], ["ANALYSE: Beschreibe und interpretiere die Grafik „Umsatzentwicklung der deutschen Musikindustrie 1984–2025“ (siehe Kapitel 3).", ["Beschreibung: Der CD-Umsatz steigt bis zum Rekord 1997 (2.308,5 Mio. €) und sinkt danach stark. Downloads entstehen (Rekord 2013, 257,7 Mio. €). Streaming wächst stark und erreicht 2025 2,04 Mrd. €. Vinyl bleibt klein.", "Interpretation: Die Digitalisierung (Tauschbörsen, Downloads, Streaming) verdrängt physische Tonträger. Streaming überholt die CD und trägt den Markt.", "Schluss: Der Gesamtmarkt wächst heute wieder (siebtes Wachstumsjahr 2025), weil Streaming den Rückgang der CD mehr als ausgleicht."], 9], ["ANALYSE: Streaming wuchs in zehn Jahren um 400 %, Vinyl um 117 % (BVMI Abb. 4). Was sagt das über das Verhältnis digitaler und physischer Formate?", ["Beide Formate wachsen gleichzeitig; Streaming wächst viel stärker.", "Physische und digitale Formate schließen sich nicht aus: Vinyl kam parallel zum Streaming zurück (Renaissance seit 2007).", "Schluss: Konsumenten nutzen Streaming für bequemen Zugang und kaufen Vinyl als Sammlerobjekt."], 8], ["CD-Umsatz 2016: 860 Mio. €, Vinyl 70 Mio. €. 2025: CD 178 Mio. €, Vinyl 152 Mio. €. Berechne die Unterschiede und beschreibe die Entwicklung.", ["2016: 860 − 70 = 790 Mio. € Vorsprung der CD. 2025: 178 − 152 = 26 Mio. €.", "Der Abstand ist stark geschrumpft; die CD liegt aber noch vorn und Vinyl hat sie nicht überholt."], 5], ["ANALYSE: Vinyl 2025: Umsatz 152 Mio. € (+2,8 %), Absatz 4,5 Mio. Stück (−2,4 %). Erkläre Umsatz und Absatz und was sich daraus ableiten lässt.", ["Umsatz = Geld in €, Absatz = verkaufte Stückzahl.", "Der Umsatz stieg, der Absatz sank leicht: Die durchschnittlichen Erlöse pro Platte stiegen, weil mehr höherwertige Editionen verkauft wurden (BVMI).", "Schluss: Käufer von Vinyl zahlen für besondere Ausgaben; das passt zur Sammlerkultur. Die Zahl der verkauften Platten allein erklärt das Wachstum nicht."], 9]], "GT": [["Ordne zu: Wer sagt sinngemäß (a) Streaming ist im Grunde Miete, (b) CDs sind das Gegenteil vom Scrollen, (c) ich besitze weit über 10.000 CDs auf kleinem Raum, (d) CDs sind im Vergleich zu Vinyl sehr günstig?", ["(a) Neil Cumming, (b) Asha Varadharajan, (c) Andrew Wales, (d) Ed."], 4], ["Warum kauft Neil Cumming CDs möglichst direkt bei den Bands?", ["Er will kleine Indie- und Folk-Bands unterstützen, die wenig Geld verdienen.", "Bei Direktkauf erhalten sie einen größeren Anteil seines Geldes als beim Streaming.", "Außerdem gehört ihm die CD für immer."], 4], ["Was meint Asha Varadharajan mit „Algorithmen machen alles vorhersehbar“?", ["Empfehlungs-Algorithmen der Streaming-Dienste führen zu vorhersehbarer Musikauswahl.", "Dagegen setzt sie den eigenen, eher zufälligen Geschmack und das selbst gestaltete Hören (fünf CDs in beliebiger Reihenfolge, Album als Erzählbogen)."], 4], ["Welche Gründe nennt Ed für seine Rückkehr zur CD, und was hatte ihn früher gestört?", ["Gründe: CDs sind im Vergleich zu teurem Vinyl sehr preiswert, sie sind greifbar und handfest; eine gute digitale Quelle ist heute so fesselnd wie ein guter Plattenspieler.", "Früher störte ihn der zu helle und glatte Klang im Vergleich zu Vinyl."], 5], ["Welche Argumente für die CD nennt Andrew Wales?", ["Besitz in physischer Form, kompakt (viele CDs in kleiner Wohnung), viel klassische Musik nur auf CD, manche Titel nur auf der CD statt auf der LP.", "Er ist aber nicht auf ein Format festgelegt (auch LPs, Kassetten, Blu-rays)."], 4], ["Welche Vorteile des Streamings erwähnt der Artikel?", ["Neil Cumming nutzt Streaming, um Musik vor dem Kauf auszuprobieren und neue Acts zu finden.", "Der Artikel enthält sonst wenig Pro-Streaming-Argumente; weitere Vorteile (Zugang zu Millionen Titeln) stehen im Leitfaden."], 4], ["Erkläre die Unterschiede zwischen CD und Streaming nach Besitz, Zugang, Erlebnis und Künstlerunterstützung.", ["Besitz: CD gehört dir dauerhaft, Streaming ist Miete (Cumming).", "Zugang: Streaming bequem und breit, CD bewusster und begrenzt.", "Erlebnis: CD = Ritual, Album als Bogen, greifbar; Streaming = scrollen, Algorithmen.", "Künstler: Direktkauf der CD bringt mehr Geld pro Kunde; beim Streaming gibt es Mikrozahlungen."], 7], ["Wie passt der Guardian-Artikel zu den BVMI-Zahlen, und warum darf man beides nicht gleichsetzen?", ["Gemeinsamer Punkt: Physische Formate sind eine Nische bewusster Hörer (BVMI: CD-Käufer 71 %, Vinyl-Käufer 87 % große Musikfans), Streaming dominiert.", "Unterschied: Der Guardian nennt britische Angaben und Einzelaussagen (+96 %, +16 %), der BVMI den deutschen Markt (CD-Umsatz −11,3 %).", "Eigene Folgerung mit Begründung."], 8]], "TR": [["Kann KI menschliche Komponisten vollständig ersetzen?", ["These (z. B. eher nein, KI als Werkzeug).", "Begründung: Der Leitfaden nennt KI zur Komposition (generieren oder unterstützen), Schülerarbeit: Ideenfindung, Mixing/Mastering als Chancen.", "Gegenargument: Risiken wie Urheberrecht und Fälschungen; KI kann schon generieren.", "Fazit mit eigener Bewertung."], 9], ["Warum wächst Vinyl trotz der Streaming-Dominanz?", ["Sammlerkultur (Leitfaden); höherwertige Editionen (BVMI); Vinyl kam parallel zum Streaming zurück.", "Vinyl-Käufer sind laut BVMI die größten Musikfans.", "Fazit: Streaming für Zugang, Vinyl für Besitz und Bindung."], 7], ["Welche Vorteile hat physische Musik für kleinere Künstler?", ["Cumming: Direktkauf bringt Bands einen größeren Anteil des Geldes als Streaming.", "Streaming bringt nur Mikrozahlungen pro Stream.", "Physische Produkte binden treue Fans (Besitz, Ritual).", "Gegenargument: Reichweite entsteht über Streaming."], 7], ["Welche Bedeutung haben regionale Musikinstitutionen in Zeiten der Globalisierung?", ["Sie stärken kulturelle Identität und sozialen Zusammenhalt.", "HMG/Noutewënzer: Tradition, Nachwuchs; Ecole Régionale: Ausbildung; Kulturhuef Kino: Kulturverständnis.", "Streaming macht Musik global verfügbar, ersetzt aber keine lokale Gemeinschaft."], 8], ["Wie verändert Big Data den Musikgeschmack?", ["Big Data steuert Marketing zielgruppengenau; Playlists und Empfehlungen entstehen aus Nutzerdaten.", "Chance: passende Entdeckungen. Risiko: Vorhersehbarkeit, Einschränkung (Guardian: Algorithmen machen alles vorhersehbar).", "Eigene Erfahrung mit Begründung."], 8], ["Als Newcomer: eher auf Streaming (Reichweite) oder auf physische Tonträger (enge Fanbindung)? Begründe.", ["These und Begründung mit Leitfaden/BVMI/Guardian.", "Streaming: Reichweite, aber Mikrozahlungen. Physisch: Bindung, Direktkauf (Cumming), Sammlerkultur.", "Fazit: Kombination oder klare Entscheidung mit Begründung."], 9], ["Ist das Freemium-Modell für Künstler fair? Diskutiere.", ["Pro: Reichweite durch kostenlosen Zugang, Werbung finanziert das System.", "Contra: Auszahlungsraten signifikant geringer.", "Aus den Kursunterlagen: BVMI-Editorial erwähnt Gespräche zwischen Musikschaffenden, Musikunternehmen und Streaming-Diensten mit dem Kulturstaatsminister über Vergütung.", "Eigene Bewertung."], 8], ["Erklärt das CD-Comeback im Guardian eine „Rückkehr der CD“ auch für Deutschland? Nimm Stellung.", ["Nein, nicht ohne Weiteres: Guardian = britische Angaben und Einzelaussagen; BVMI = CD-Umsatz in Deutschland 2025 −11,3 %.", "Gemeinsamkeit: Für bewusste Hörer hat die CD Wert (Besitz, Ritual).", "Eigenes begründetes Fazit."], 8]], "TQ": [["Kleine Frage 1", "Welche drei primären Vertriebsmodelle dominieren die heutige Musikindustrie?", ["Abonnement-Modelle (Premium), Freemium-Modelle, Einzelkäufe (Downloads)."]], ["Kleine Frage 2", "Wie hoch war der Umsatzanteil von Audio- und Video-Streaming auf dem deutschen Musikmarkt im Jahr 2025 laut den BVMI-Daten?", ["84,4 %."]], ["Kleine Frage 3", "Nenne mindestens zwei Bereiche, in denen Künstliche Intelligenz (KI) in der modernen Musiklandschaft eingesetzt wird.", ["Komposition (generieren oder unterstützen), Produktion und Mastering, Marketing (Big Data)."]], ["Kleine Frage 4", "Was ist das Nachwuchsprogramm „Noutewënzer“ und von welcher luxemburgischen Institution wird es angeboten?", ["Nachwuchsprogramm für Kinder ab 9 Jahren der Harmonie Municipale de la Ville de Grevenmacher (HMG)."]], ["Große Frage 1", "Erkläre den historischen Wandel der Vertriebsmodelle vom Ende der 1990er Jahre bis heute und gehe dabei auf die verschiedenen Zwischenphasen (z. B. illegale Tauschbörsen und legaler Download-Markt) ein.", ["Einleitung: Übergang von physischen Tonträgern zur digitalen Distribution, größter Paradigmenwechsel.", "Späte 1990er: Blütezeit der CD. Danach disruptive illegale Tauschbörsen (Napster). Dann legaler Download-Markt (iTunes). Heute Dominanz des Streamings.", "Folge: Streaming, Downloads und Online-Plattformen revolutionieren den Musikkonsum; Künstler erhalten Mikrozahlungen."]], ["Große Frage 2", "Analysiere die im Text dargestellten wirtschaftlichen Tendenzen von CDs im Vergleich zu Vinyl-Schallplatten. Warum glaubst du, verzeichnen Schallplatten trotz der digitalen Dominanz ein Wachstum durch die sogenannte „Sammlerkultur“?", ["CD: 7,2 %, sinkend (−11,3 %), noch zweitstärkstes Format. Vinyl: 6,3 %, +2,8 %, profitiert von Sammlerkultur.", "Begründung: Sammler wollen Besitz, ein greifbares Produkt und besondere Editionen (BVMI: höherwertige Editionen). Eigene Erklärung mit Bezug zum Streaming: Zugang digital, Besitz physisch."]], ["Große Frage 3", "Im Leitfaden wird erwähnt, dass sich die Einkommensstruktur für Künstler drastisch verändert hat. Diskutiere, was der Wechsel von punktuellen Albumverkäufen hin zu Mikrozahlungen pro Stream für Musiker bedeutet.", ["Früher punktuell hohe Einnahmen durch Albumverkäufe.", "Heute kontinuierliche, aber extrem geringe Mikrozahlungen pro Stream.", "Ursache: Digitalisierung, Streaming-Dominanz (84,4 %).", "Diskussion: Chance auf kontinuierliche Einnahmen und Reichweite, Risiko sehr niedriger Beträge pro Nutzung."]], ["Große Frage 4", "Erläutere die Bedeutung regionaler Verankerung in Zeiten der Globalisierung. Welche Rolle spielen Institutionen wie die Ecole Régionale de Musique Grevenmacher und das Kulturhuef Kino für das lokale Kulturverständnis?", ["Streaming macht Musik global verfügbar, aber die lokale Verwurzelung bleibt für den sozialen Zusammenhalt essenziell.", "Beispiele: HMG (Tradition, Nachwuchs), Ecole Régionale (Ausbildung), Kulturhuef Kino (Kulturverständnis).", "Kulturhuef Kino: Sonderveranstaltungen und Filmkunst prägen das Kulturverständnis; Ecole Régionale: Basisarbeit und Ausbildung."]], ["Freie Frage 1", "Eigene Meinung: Wenn du heute als aufstrebende/r Musiker/in starten würdest, würdest du dich eher auf Streaming (für eine möglichst große Reichweite) oder auf physische Tonträger wie Vinyl (für eine enge Bindung zu treuen Fans) konzentrieren? Begründe deine Wahl.", ["These und Begründung mit Leitfaden/BVMI/Guardian.", "Streaming: Reichweite, aber Mikrozahlungen. Physisch: Bindung, Direktkauf (Cumming), Sammlerkultur.", "Fazit: Kombination oder klare Entscheidung mit Begründung."]], ["Freie Frage 2", "Diskussion: Laut dem Leitfaden wird Künstliche Intelligenz bereits genutzt, um Kompositionen algorithmisch zu generieren oder zu unterstützen. Denkst du, dass KI-generierte Musik in der Zukunft menschliche Komponisten vollständig ersetzen könnte, oder wird immer etwas „Menschliches“ in der Musik fehlen?", ["These (z. B. eher nein, KI als Werkzeug).", "Begründung: Der Leitfaden nennt KI zur Komposition (generieren oder unterstützen), Schülerarbeit: Ideenfindung, Mixing/Mastering als Chancen.", "Gegenargument: Risiken wie Urheberrecht und Fälschungen; KI kann schon generieren.", "Fazit mit eigener Bewertung."]], ["Aktualität 1", "Aktuelle Plattform-Ökonomie: Das Freemium-Modell bietet kostenlosen Zugang durch Werbefinanzierung, bringt den Künstlern aber signifikant geringere Auszahlungsraten. Verfolge aktuelle Debatten in der Musikwelt: Wie versuchen Musiker und Gewerkschaften derzeit, faire Bezahlungen von Streaming-Riesen wie Spotify oder Apple Music einzufordern?", ["Diese Frage verlangt externes Mitdenken. Aus den Kursunterlagen: Das BVMI-Editorial nennt getrennte Gesprächsrunden von Musikschaffenden, Musikunternehmen und Streaming-Diensten mit dem Kulturstaatsminister, die zeitnah an einem Tisch zusammenkommen sollen.", "BVMI (Sicht des Labelverbands, nicht neutral): Die Branche fordert klar definierte Bezugsgrößen und Trennschärfe in der Debatte um Streaming-Vergütung. Zahlen: 2019–2022 gaben die Labels 43 % der Industrieeinnahmen an Künstler weiter und reinvestierten durchschnittlich 33 %; weltweit lag der Anteil der Künstlervergütung am Gesamtumsatz 2024 bei 35,5 % (IFPI).", "Zu Gewerkschaften und konkreten aktuellen Debatten enthalten die Unterlagen nichts. Ergänze aus dem Unterricht oder eigener Beobachtung und mache klar, was belegt ist."]], ["Aktualität 2", "Big Data im Alltag: Marketingkampagnen werden heutzutage durch gigantische Datensätze zielgruppengenau ausgesteuert. Wie nimmst du diese Technologie in deinem eigenen Alltag wahr (z. B. personalisierte Playlists, Algorithmen auf TikTok oder Release-Empfehlungen)? Empfindest du dies als nützlich oder eher als Einschränkung deines eigenen Musikgeschmacks?", ["Big Data steuert Marketing zielgruppengenau; Playlists und Empfehlungen entstehen aus Nutzerdaten.", "Chance: passende Entdeckungen. Risiko: Vorhersehbarkeit, Einschränkung (Guardian: Algorithmen machen alles vorhersehbar).", "Eigene Erfahrung mit Begründung."]]], "WH": [["Wiederholungsfrage 1", "Beschreiben Sie die wesentlichen Unterschiede in der Monetarisierung zwischen dem Abonnement-Modell, dem Freemium-Modell und dem klassischen CD-Verkauf.", ["Abo: Gebühr des Nutzers, laufende kleine Zahlungen pro Stream.", "Freemium: Werbung finanziert; Auszahlungen signifikant geringer.", "CD: einmaliger Verkauf, punktuell höhere Einnahme; Käufer besitzt das Produkt."]], ["Wiederholungsfrage 2", "Analysieren Sie die Entwicklung des physischen Musikmarktes (CD vs. Vinyl) anhand der BVMI-Daten von 2025. Welche Rückschlüsse lassen sich auf das Konsumentenverhalten ziehen?", ["Kernaussage: Der physische Markt schrumpft (14,2 % Anteil), CD und Vinyl entwickeln sich aber gegensätzlich.", "CD: 7,2 %, Umsatz −11,3 %, noch zweitstärkstes Format. Vinyl: 6,3 %, +2,8 %, wächst durch Sammlerkultur; Umsatz steigt trotz leicht sinkendem Absatz (höherwertige Editionen, BVMI).", "Rückschluss: Die breite Masse nutzt Streaming (84,4 %); physische Tonträger kaufen vor allem Fans und Sammler, die Besitz und ein greifbares Produkt wollen.", "Schluss: Digital und physisch schließen sich nicht aus."]], ["Wiederholungsfrage 3", "Inwiefern tragen regionale Institutionen wie die HMG oder die Ecole Régionale de Musique Grevenmacher zur kulturellen Identitätsbildung in Zeiten globalen Streamings bei?", ["Kernaussage: Trotz globaler Verfügbarkeit bleibt lokale Verwurzelung für den sozialen Zusammenhalt essenziell.", "HMG: Tradition seit 1834, Galakonzert, Noutewënzer (Nachwuchs) halten Musik vor Ort lebendig. Ecole Régionale: Ausbildung (klassisch, modern, Schauspiel, Tanz) als Fundament für Karrieren.", "Beispiel: Kulturhuef Kino ergänzt mit Filmkunst und Sonderveranstaltungen das Kulturverständnis.", "Schluss: Streaming bringt Musik weltweit, Identität und Gemeinschaft entstehen aber lokal."]]], "TQM": [["Kleine Frage 1 (Wissen)", "Kap. 2"], ["Kleine Frage 2 (Wissen)", "Kap. 3"], ["Kleine Frage 3 (Wissen)", "Kap. 5"], ["Kleine Frage 4 (Wissen)", "Kap. 6"], ["Große Frage 1 (Analyse)", "Kap. 2"], ["Große Frage 2 (Analyse)", "Kap. 3"], ["Große Frage 3 (Analyse)", "Kap. 4"], ["Große Frage 4 (Analyse)", "Kap. 6"], ["Freie Frage 1 (Meinung)", "Kap. 4 und 7"], ["Freie Frage 2 (Diskussion)", "Kap. 5"], ["Aktualität 1", "Kap. 2 und 4 (externes Mitdenken)"], ["Aktualität 2", "Kap. 5 und 7"]], "EX": [["Teil 1 – Wissensfragen (15 Punkte)", [["1.1", "Nenne die drei primären Säulen der Musikindustrie und je ein Merkmal.", 3, 3, ["je Säule (Recorded Music, Publishing, Live-Entertainment) 0,5 Punkte für den Namen und 0,5 Punkte für ein passendes Merkmal (3 Punkte gesamt)", "Beispiele: Master Rights/Labels; Urheberrechte/Synchronisation; Tickets, Sponsoring, Merchandising"]], ["1.2", "Bringe in die richtige Reihenfolge: Streaming, Napster, CD-Blüte, iTunes.", 2, 2, ["CD-Blüte → Napster → iTunes → Streaming (2 Punkte; je einer fehlerhaft −0,5)"]], ["1.3", "Definiere Tantiemen und Big Data.", 3, 4, ["Tantiemen: laufende Gewinnbeteiligungen/Nutzungsvergütungen für Urheber (1,5 P)", "Big Data: Sammlung und Auswertung riesiger Datenmengen, z. B. Nutzerverhalten auf Spotify, für Marketing- und A&R-Entscheidungen (1,5 P)"]], ["1.4", "Nenne den Gesamtumsatz 2025 und die Umsatzanteile von Streaming, CD, Vinyl und Downloads.", 4, 3, ["Gesamtumsatz 2,42 Mrd. € (1 P)", "Streaming 84,4 % (1 P)", "CD 7,2 % und Vinyl 6,3 % (1 P)", "Downloads 1,4 % (1 P)"]], ["1.5", "Was ist „Noutewënzer“ und welche Institution bietet es an?", 3, 2, ["Nachwuchsprogramm für Kinder ab 9 Jahren (2 P)", "Harmonie Municipale de la Ville de Grevenmacher (HMG) (1 P)"]]]], ["Teil 2 – Verständnisfragen (15 Punkte)", [["2.1", "Beschreibe die Unterschiede in der Monetarisierung zwischen Abonnement-Modell, Freemium-Modell und klassischem CD-Verkauf.", 6, 6, ["Abo: Gebühr, laufende kleine Zahlungen pro Stream (2 P)", "Freemium: Werbung, Auszahlung signifikant geringer (2 P)", "CD: einmaliger Verkauf, punktuell höher, Besitz (2 P)"]], ["2.2", "Erkläre den Unterschied zwischen Streaming und Download.", 3, 3, ["Streaming: Übertragung ohne dauerhafte Kopie, Zugang (1,5 P)", "Download: permanente digitale Kopie, Einzelkauf (1,5 P)"]], ["2.3", "Erkläre den Unterschied zwischen Recorded Music und Publishing.", 3, 3, ["Recorded Music: Aufnahme, Master Rights/Leistungsschutzrechte (1,5 P)", "Publishing: Komposition, Urheberrechte, Lizenzierung, z. B. Synchronisation (1,5 P)"]], ["2.4", "Nenne drei Einsatzfelder von KI und erkläre sie kurz.", 3, 3, ["Komposition (generieren/unterstützen), Produktion und Mastering (Audio-Analysen), Marketing (Big Data, Zielgruppen) – je 1 P"]]]], ["Teil 3 – Analysefragen (18 Punkte)", [["3.1", "Analysiere CD und Vinyl anhand der BVMI-Daten 2025 und ziehe Rückschlüsse auf das Konsumentenverhalten.", 6, 7, ["CD 7,2 %, −11,3 %, zweitstärkstes Format (1,5 P)", "Vinyl 6,3 %, +2,8 % (1,5 P)", "Umsatz/Absatz: Umsatz steigt trotz sinkendem Absatz wegen höherwertiger Editionen (1 P)", "Sammlerkultur und Besitz als Motiv (1 P)", "Streaming dominiert, physisch Nische (1 P)"]], ["3.2", "Interpretiere die Entwicklung 2016 → 2025 (Audio-Streaming 24,1 %, CD 53,8 % im Jahr 2016; Streaming 84,4 %, CD 7,2 % im Jahr 2025). Beachte die Kategorien.", 6, 7, ["Richtige Zahlen (1,5 P)", "Richtung der Entwicklung: Streaming wächst, CD sinkt (1,5 P)", "Hinweis Audio-Streaming (2016) gegenüber Audio-/Video-Streaming (2025) (1,5 P)", "Ursache Digitalisierung (1 P)", "Schlussfolgerung (0,5 P)"]], ["3.3", "Ordne die Argumente der vier Personen im Guardian-Artikel zu und erkläre, warum CDs ein Comeback erleben.", 6, 8, ["Wales: Besitz, Platz, Klassik nur auf CD (1,5 P)", "Cumming: Direktkauf, Besitz statt Miete, Ritual, Streaming zum Entdecken (1,5 P)", "Varadharajan: Albumbogen, gegen Scrollen und Algorithmen (1,5 P)", "Ed: Preis gegenüber Vinyl, greifbar (1 P)", "Zusammenhang und Abgrenzung zu BVMI-Zahlen (0,5 P)"]]]], ["Teil 4 – Transferfragen (12 Punkte)", [["4.1", "Du startest als Newcomer: Streaming oder physische Tonträger? Begründe deine Meinung.", 6, 8, ["klare These (1 P)", "Argumente aus Kurs/BVMI/Guardian (3 P)", "Gegenargument (1 P)", "Fazit (1 P)"]], ["4.2", "Erkläre die Bedeutung regionaler Musikkultur in Zeiten globaler Streaming-Plattformen.", 6, 8, ["Musik und Identität/Zusammenhalt (1,5 P)", "HMG/Noutewënzer (1,5 P)", "Ecole Régionale (1,5 P)", "Kulturhuef Kino (0,5 P)", "Bezug zu Globalisierung/Streaming (1 P)"]]]]]};
